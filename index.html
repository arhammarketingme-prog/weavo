<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weavo Messaging</title>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        .card { max-width: 420px; margin: 40px auto; padding: 25px; border: 1px solid #e5e7eb; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .btn { padding: 12px 24px; font-size: 16px; background-color: #059669; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        .user-tag { background: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Weavo Messaging</h2>
        
        <!-- लॉगिन नसताना दिसणारा बॉक्स -->
        <div id="loginArea" style="display: none;">
            <p>Weavo मध्ये थेट लॉगिन उपलब्ध आहे:</p>
            <button class="btn" onclick="signInGoogle()">Continue with Google</button>
        </div>

        <!-- थेट लॉगिन झाल्यावर दिसणारा मुख्य ॲप विभाग -->
        <div id="appArea" style="display: none;">
            <h3>प्रवेश यशस्वी! 🎉</h3>
            <p>स्वागत आहे: <span id="weavoUser" class="user-tag"></span></p>
            <p style="color: #4b5563; font-size: 14px;">(AllERP द्वारे स्वयंचलित जोडणी यशस्वी झाली)</p>
            <br>
            <button class="btn" style="background-color: #dc2626;" onclick="logout()">लॉगआउट</button>
        </div>
    </div>

    <script>
        const WEAVO_SUPABASE_URL = 'https://xpsxbvmziibbrjnadrlm.supabase.co';
        const WEAVO_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...'; // तुमची Weavo ची anon key इथे ठेवा
        const supabaseClient = supabase.createClient(WEAVO_SUPABASE_URL, WEAVO_SUPABASE_KEY);

        function showApp(email) {
            document.getElementById('loginArea').style.display = 'none';
            document.getElementById('appArea').style.display = 'block';
            document.getElementById('weavoUser').innerText = email;
        }

        async function handleSSOAndAuth() {
            // १. जर AllERP वरून ईमेल आला असेल तर थेट आत घेणे
            if (window.location.hash.includes('user_email')) {
                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                const userEmail = hashParams.get('user_email');
                
                if (userEmail) {
                    localStorage.setItem('weavo_logged_email', userEmail);
                    window.history.replaceState(null, null, window.location.pathname);
                    showApp(userEmail);
                    return;
                }
            }

            // २. पूर्वी सेव्ह झालेला ईमेल तपासणे
            const savedEmail = localStorage.getItem('weavo_logged_email');
            if (savedEmail) {
                showApp(savedEmail);
                return;
            }

            // ३. सामान्य Supabase सेशन तपासणे
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session && session.user) {
                showApp(session.user.email);
            } else {
                document.getElementById('loginArea').style.display = 'block';
            }
        }

        async function signInGoogle() {
            await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + window.location.pathname
                }
            });
        }

        async function logout() {
            localStorage.removeItem('weavo_logged_email');
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        // पेज लोड होताच थेट तपासणी
        window.addEventListener('DOMContentLoaded', handleSSOAndAuth);
    </script>
</body>
</html>
