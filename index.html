<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Weavo — Messaging & Calls</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563EB" />
  <link rel="icon" href="icon-192.png" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    :root {
      --primary: #2563EB;
      --primary-dark: #1D4ED8;
      --bg: #F8FAFC;
      --surface: #FFFFFF;
      --text: #0F172A;
      --text-muted: #64748B;
      --border: #E2E8F0;
      --incoming: #FFFFFF;
      --outgoing: #DCF8C6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #auth-screen {
      position: fixed;
      inset: 0;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 9999;
    }
    .auth-card {
      width: 100%;
      max-width: 380px;
      background: #FFFFFF;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      border: 1px solid var(--border);
      text-align: center;
    }
    .auth-card img { width: 68px; height: 68px; margin-bottom: 12px; }
    .auth-card h2 { font-size: 22px; color: var(--primary); margin-bottom: 6px; }
    .auth-card p { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
    .form-group { margin-bottom: 14px; text-align: left; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; color: var(--text); }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }
    .auth-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }
    
    /* मुख्य ॲप लेआउट */
    #app-container {
      display: none;
      flex: 1;
      height: 100vh;
      overflow: hidden;
      flex-direction: column;
    }
    .app-header {
      background: var(--primary);
      color: #FFFFFF;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .app-header h1 { font-size: 19px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
    .app-body {
      flex: 1;
      display: flex;
      height: calc(100vh - 56px);
      overflow: hidden;
    }
    .chat-sidebar {
      width: 320px;
      border-right: 1px solid var(--border);
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
    }
    .chat-area {
      flex: 1;
      background: #EFEAE2;
      display: flex;
      flex-direction: column;
    }
    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .chat-footer {
      background: #F0F2F5;
      padding: 10px 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      border-top: 1px solid var(--border);
    }
    .chat-footer input {
      flex: 1;
      padding: 10px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      outline: none;
      font-size: 14px;
    }
    .send-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 700;
      cursor: pointer;
    }
    .msg {
      max-width: 75%;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      line-height: 1.4;
      word-wrap: break-word;
    }
    .msg.in { align-self: flex-start; background: var(--incoming); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
    .msg.out { align-self: flex-end; background: var(--outgoing); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }
  </style>
</head>
<body>

  <!-- ऑथेंटिकेशन / लॉगिन स्क्रीन -->
  <div id="auth-screen">
    <div class="auth-card">
      <img src="icon-192.png" alt="Weavo">
      <h2>Weavo Messaging</h2>
      <p id="auth-status-desc">आपल्या खात्यामध्ये प्रवेश करा किंवा AllERP द्वारे कनेक्ट व्हा</p>
      
      <div id="auth-inputs">
        <div class="form-group">
          <label>ईमेल पत्ता / Email</label>
          <input type="email" id="auth-email" placeholder="example@gmail.com">
        </div>
        <div class="form-group">
          <label>पासवर्ड / Password</label>
          <input type="password" id="auth-password" placeholder="••••••••">
        </div>
        <button type="button" class="auth-btn" onclick="handleStandardLogin()">लॉगिन करा</button>
      </div>
    </div>
  </div>

  <!-- मुख्य चॅट स्क्रीन -->
  <div id="app-container">
    <header class="app-header">
      <h1><img src="icon-192.png" style="width:26px; height:26px; border-radius:50%; background:#fff; padding:1px;"> Weavo</h1>
      <div style="display:flex; align-items:center; gap:10px;">
        <span id="user-display-badge" style="font-size:12px; background:rgba(255,255,255,0.2); padding:4px 8px; border-radius:4px;"></span>
        <button onclick="handleLogout()" style="background:transparent; color:#fff; border:1px solid rgba(255,255,255,0.4); padding:4px 10px; border-radius:6px; cursor:pointer; font-size:12px;">बाहेर पडा</button>
      </div>
    </header>

    <div class="app-body">
      <aside class="chat-sidebar">
        <div style="padding:12px; border-bottom:1px solid var(--border); font-weight:700; font-size:13px; color:var(--text-muted);">
          💬 सक्रिय चॅट्स (Active Chats)
        </div>
        <div id="chat-threads" style="flex:1; overflow-y:auto; padding:8px;">
          <div style="padding:10px; border-radius:8px; background:#eff6ff; border:1px solid #bfdbfe; font-size:13px;">
            <strong id="active-store-label">दुकानदार / ग्राहक चॅट</strong><br>
            <span style="font-size:11px; color:#64748b;">AllERP द्वारे थेट कनेक्टेड</span>
          </div>
        </div>
      </aside>

      <main class="chat-area">
        <div class="chat-messages" id="messages-list">
          <div class="msg in">
            नमस्कार! Weavo सुरक्षित चॅटमध्ये आपले स्वागत आहे. आपण येथून थेट सामानाची यादी पाठवू शकता किंवा संवाद साधू शकता.
          </div>
        </div>

        <div class="chat-footer">
          <input type="text" id="chat-msg-input" placeholder="येथे मेसेज किंवा किराणा सामानाची यादी टाईप करा..." onkeypress="if(event.key==='Enter') sendChatMessage()">
          <button type="button" class="send-btn" onclick="sendChatMessage()">पाठवा ➤</button>
        </div>
      </main>
    </div>
  </div>

  <script>
    // Supabase क्लायंट सुरू करणे
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 🌟 AllERP Single Sign-On (SSO) आणि ऑटो-लॉगिन हँडलर
    async function processAllERPAutoLogin() {
      const urlParams = new URLSearchParams(window.location.search);
      const ssoData = urlParams.get('sso_auth');
      const storeName = urlParams.get('store');

      if (storeName) {
        const storeLabel = document.getElementById('active-store-label');
        if (storeLabel) storeLabel.textContent = decodeURIComponent(storeName);
      }

      if (ssoData) {
        document.getElementById('auth-status-desc').textContent = 'AllERP वरून ऑटो-लॉगिन होत आहे, कृपया प्रतीक्षा करा...';
        try {
          const authPayload = JSON.parse(decodeURIComponent(ssoData));
          if (authPayload.access_token && authPayload.refresh_token) {
            const { data, error } = await sb.auth.setSession({
              access_token: authPayload.access_token,
              refresh_token: authPayload.refresh_token
            });

            if (!error && data?.session) {
              console.log("✅ AllERP द्वारे Weavo वर ऑटो-लॉगिन यशस्वी झाले!");
              // URL स्वच्छ करणे
              const cleanUrl = window.location.origin + window.location.pathname + (storeName ? `?store=${encodeURIComponent(storeName)}` : '');
              window.history.replaceState({}, document.title, cleanUrl);
              showAppScreen(data.session.user);
              return;
            }
          }
        } catch (err) {
          console.error("SSO Login Error:", err);
        }
      }

      // नियमित सेशन तपासणे
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        showAppScreen(session.user);
      } else {
        document.getElementById('auth-screen').style.display = 'flex';
      }
    }

    function showAppScreen(user) {
      document.getElementById('auth-screen').style.display = 'none';
      document.getElementById('app-container').style.display = 'flex';
      const badge = document.getElementById('user-display-badge');
      if (badge) badge.textContent = user.email || 'User';
    }

    async function handleStandardLogin() {
      const email = document.getElementById('auth-email').value.trim();
      const password = document.getElementById('auth-password').value.trim();
      if (!email || !password) { alert('ईमेल व पासवर्ड टाका.'); return; }

      const { data, error } = await sb.auth.signInWithPassword({ email, password });
      if (error) {
        alert('लॉगिन त्रुटी: ' + error.message);
      } else {
        showAppScreen(data.user);
      }
    }

    async function handleLogout() {
      await sb.auth.signOut();
      window.location.reload();
    }

    function sendChatMessage() {
      const input = document.getElementById('chat-msg-input');
      const text = input.value.trim();
      if (!text) return;

      const list = document.getElementById('messages-list');
      const bubble = document.createElement('div');
      bubble.className = 'msg out';
      bubble.textContent = text;
      list.appendChild(bubble);

      input.value = '';
      list.scrollTop = list.scrollHeight;
    }

    // ॲप सुरू करणे
    processAllERPAutoLogin();
  </script>
</body>
</html>
