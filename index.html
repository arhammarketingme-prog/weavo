<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weavo — One World. One Communication Layer.</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { margin: 0; font-family: sans-serif; background: #0f1115; color: #e9eaee; height: 100vh; display: flex; }
  #auth-screen { margin: auto; width: min(390px, 90vw); background: #171a21; padding: 30px; border-radius: 20px; text-align: center; }
  input, button { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #22252e; background: #10121a; color: #fff; font-size: 14px; }
  button { background: #6366f1; border: none; font-weight: bold; cursor: pointer; }
  #app { display: none; width: 100%; height: 100vh; }
  #app.active { display: flex; }
  #sidebar { width: 280px; background: #171a21; border-right: 1px solid #22252e; padding: 15px; }
  #chat-area { flex: 1; display: flex; flex-direction: column; background: #0b0d10; padding: 20px; }
  #messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 65%; padding: 10px 14px; border-radius: 10px; font-size: 14px; }
  .bubble.me { align-self: flex-end; background: #6366f1; }
  .bubble.them { align-self: flex-start; background: #23262f; }
</style>
</head>
<body>

<div id="auth-screen">
  <h2>Weavo Login</h2>
  <input id="reg-email" placeholder="Email address" />
  <input id="reg-password" type="password" placeholder="Password" />
  <button id="login-btn">Continue to Weavo</button>
  <div id="error" style="color:#f87171; font-size:13px;"></div>
</div>

<div id="app">
  <div id="sidebar">
    <h3 id="me-name">User</h3>
    <button onclick="sb.auth.signOut(); localStorage.clear(); location.reload();">Logout</button>
    <div id="conv-list"></div>
  </div>
  <div id="chat-area">
    <div id="messages"></div>
    <div style="display:flex; gap:8px;">
      <input id="msg-input" placeholder="मेसेज लिहा..." style="margin:0;" />
      <button onclick="sendMessage()" style="width:auto; margin:0;">पाठवा</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://flprhrbbllxfcdaornio.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZscHJocmJibGx4ZmNkYW9ybmlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMDk1MzcsImV4cCI6MjEwMTU4NTUzN30._dxfJ8h50eNEIq89m3467Qr4p8Mw5OuqllwkJzSyTDw";

let sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { storage: window.localStorage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

let me = null;
let activeConv = null;

async function initWeavo() {
  const urlParams = new URLSearchParams(window.location.search);
  const customerEmail = urlParams.get('customer_email') || localStorage.getItem('global_unified_email');
  
  const sessionRes = await sb.auth.getSession();
  if (sessionRes.data?.session?.user) {
    me = sessionRes.data.session.user;
    startApp(me.email);
  } else if (customerEmail) {
    startApp(customerEmail);
  }
}

function startApp(email) {
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').classList.add('active');
  document.getElementById('me-name').textContent = email;
}

document.getElementById('login-btn').onclick = async () => {
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;
  const res = await sb.auth.signInWithPassword({ email, password });
  if (res.error) { document.getElementById('error').textContent = res.error.message; return; }
  startApp(res.data.user.email);
};

function sendMessage() {
  const input = document.getElementById('msg-input');
  if (!input.value.trim()) return;
  const box = document.getElementById('messages');
  box.innerHTML += `<div class="bubble me">${input.value}</div>`;
  input.value = '';
}

initWeavo();
</script>
</body>
</html>
