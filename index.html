<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weavo — One World. One Communication Layer.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236366f1'/%3E%3Ctext x='50' y='68' font-size='55' font-family='Arial' fill='white' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E" />
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#6366f1" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --accent: #6366f1; --accent-soft: #6366f122;
    --text: #e9eaee; --muted: #8b8fa3; --bubble-me: #6366f1; --bubble-them: #23262f; --radius: 16px;
    --input-bg: #10121a; --border: #22252e;
  }
  body.light {
    --bg: #f4f5f7; --panel: #ffffff; --accent: #6366f1; --accent-soft: #6366f11a;
    --text: #14161c; --muted: #6b7280; --bubble-me: #6366f1; --bubble-them: #eceef2;
    --input-bg: #f0f1f4; --border: #e5e7eb;
  }
  body.light .bubble.them { color: #14161c; }
  body.light .call-box, body.light #group-info-panel, body.light #discover-panel, body.light #discover-business-panel,
  body.light #new-group, body.light #new-channel, body.light #settings-panel, body.light #direct-info-panel,
  body.light #disappear-panel, body.light .archived-toggle, body.light .reaction-picker { background: var(--panel); }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; }
  #auth-screen { margin: auto; width: 320px; background: var(--panel); padding: 32px; border-radius: var(--radius); box-shadow: 0 20px 60px #0008; }
  #auth-screen h1 { font-size: 22px; margin: 0 0 4px; }
  #auth-screen p.tag { color: var(--muted); margin: 0 0 24px; font-size: 13px; }
  input { width: 100%; padding: 12px 14px; margin-bottom: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 14px; }
  input:focus { outline: none; border-color: var(--accent); }
  button { width: 100%; padding: 12px; border-radius: 10px; border: none; cursor: pointer; background: var(--accent); color: white; font-weight: 600; font-size: 14px; margin-top: 4px; }
  button.secondary { background: transparent; color: var(--accent); margin-top: 8px; }
  #error { color: #f87171; font-size: 13px; min-height: 16px; margin-top: 8px; }
  #app { display: none; width: 100%; height: 100vh; }
  #app.active { display: flex; }
  #sidebar { width: 280px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #back-btn { display: none; }

  /* ---------- MOBILE RESPONSIVE (WhatsApp-स्टाईल: list ↔ chat toggle) ---------- */
  @media (max-width: 768px) {
    #sidebar { width: 100%; }
    #chat-area { width: 100%; }
    #app.chat-open #sidebar { display: none; }
    #app:not(.chat-open) #chat-area { display: none; }
    #back-btn { display: inline-flex !important; }
    .call-box.wide { width: 92vw; }
    .video-tile { width: 44vw; }
  }
  #me-bar { padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #me-bar .left { display: flex; align-items: center; gap: 10px; }
  #me-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; overflow: hidden; flex-shrink: 0; }
  #me-avatar img { width: 100%; height: 100%; object-fit: cover; }
  #me-bar .name { font-weight: 600; }
  #me-bar .right { display: flex; align-items: center; gap: 4px; }
  #me-bar button.logout { width: auto; background: transparent; color: var(--muted); padding: 4px 8px; font-size: 12px; }
  #settings-panel { display: none; padding: 14px 16px; background: #14161c; border-bottom: 1px solid var(--border); }
  #settings-panel label { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; }
  .settings-row { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .settings-label { font-size: 12px; color: var(--muted); }
  #settings-panel select, #settings-panel textarea, #business-fields input, #business-fields textarea { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 13px; }
  #settings-panel button, #business-fields button { width: auto; padding: 8px 14px; margin-top: 6px; align-self: flex-start; }
  #business-fields { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--border); padding-top: 12px; }
  .typing-indicator { padding: 4px 20px; font-size: 12px; color: var(--muted); font-style: italic; }
  .last-seen { font-size: 11px; color: var(--muted); font-weight: 400; }
  #global-search-wrap { padding: 10px 16px; border-bottom: 1px solid var(--border); position: relative; }
  #global-search-input { width: 100%; margin: 0; }
  #global-search-results { position: absolute; left: 16px; right: 16px; top: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-top: 4px; max-height: 300px; overflow-y: auto; z-index: 10; box-shadow: 0 10px 30px #0006; }
  .gs-section { padding: 6px 12px; font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .gs-item { padding: 8px 12px; cursor: pointer; font-size: 13px; }
  .gs-item:hover { background: var(--accent-soft); }
  #new-chat { padding: 12px 16px; display: flex; gap: 6px; border-bottom: 1px solid var(--border); }
  #new-chat input { margin: 0; }
  #new-chat button { width: auto; padding: 10px 14px; }
  #tab-row { padding: 8px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; }
  .link-btn { width: auto; background: transparent; color: var(--accent); padding: 4px 0; font-size: 12px; text-align: left; margin: 0; }
  #new-group, #new-channel { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
  #new-group input, #new-channel input { margin: 0; }
  #new-group button, #new-channel button { width: auto; padding: 8px 14px; align-self: flex-start; }
  #discover-panel { padding: 12px 16px; border-bottom: 1px solid var(--border); max-height: 220px; overflow-y: auto; }
  .disc-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 13px; border-bottom: 1px solid var(--border); }
  .disc-item button { width: auto; padding: 5px 10px; font-size: 12px; margin: 0; }
  .disc-empty { font-size: 12px; color: var(--muted); }
  .biz-card { border-bottom: 1px solid var(--border); padding: 10px 0; font-size: 13px; }
  .biz-name { font-weight: 600; }
  .biz-cat { font-weight: 400; color: var(--muted); font-size: 12px; }
  .biz-line { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .biz-desc { margin-top: 4px; font-size: 12px; }
  .biz-chat { width: auto; padding: 6px 12px; font-size: 12px; margin-top: 8px; }
  .biz-photo { width: 100%; max-height: 120px; object-fit: cover; border-radius: 8px; margin-bottom: 6px; }
  .readonly-note { padding: 12px 20px; text-align: center; font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); }

  /* ---------- CALLING ---------- */
  .call-overlay { position: fixed; inset: 0; background: rgba(10,11,15,0.92); display: flex; align-items: center; justify-content: center; z-index: 999; }
  .call-box { background: var(--panel); padding: 32px; border-radius: 20px; text-align: center; width: 300px; box-shadow: 0 20px 60px #0008; }
  .call-box.wide { width: min(90vw, 480px); }
  .call-avatar { font-size: 48px; margin-bottom: 12px; }
  .call-name { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .call-sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .call-btn-row { display: flex; gap: 16px; justify-content: center; }
  .call-btn { width: auto; padding: 12px 24px; border-radius: 24px; font-weight: 600; }
  .call-btn.accept { background: #22c55e; }
  .call-btn.decline { background: #ef4444; }
  .video-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; justify-content: center; }
  .video-tile { position: relative; width: 160px; }
  .video-tile video { width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 10px; object-fit: cover; }
  .call-overlay.audio-only .video-tile video { display: none; }
  .call-overlay.audio-only .video-tile { width: 60px; height: 60px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; }
  .call-icon-btn { width: 52px; height: 52px; border-radius: 50%; font-size: 20px; background: var(--border); margin: 0; padding: 0; }
  .call-icon-btn.hangup { background: #ef4444; }
  .call-icon-btn.muted { background: #ef4444; }

  /* ---------- EDIT / TICKS / REACTIONS ---------- */
  .edit-input { background: #0d0f14; border: 1px solid var(--accent); color: white; border-radius: 6px; padding: 4px 8px; font-size: 14px; width: 160px; }
  .edit-save { width: auto; padding: 4px 10px; font-size: 12px; margin-left: 4px; }
  .edited-tag { font-size: 11px; opacity: 0.6; font-style: italic; }
  .tick { font-size: 11px; margin-left: 4px; opacity: 0.7; }
  .tick.read { color: #60a5fa; opacity: 1; }
  .reaction-pills { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .pill { background: var(--bubble-them); border-radius: 10px; padding: 1px 7px; font-size: 12px; cursor: pointer; }
  .pill.mine { background: var(--accent); }
  .reaction-picker { position: absolute; bottom: 100%; right: 0; background: var(--bubble-them); border-radius: 20px; padding: 6px 10px; display: flex; gap: 6px; box-shadow: 0 8px 24px #0008; margin-bottom: 4px; z-index: 5; }
  .pick-emoji { cursor: pointer; font-size: 18px; }
  .pick-emoji:hover { transform: scale(1.2); }
  #conv-list { flex: 1; overflow-y: auto; }
  .conv-item { padding: 10px 16px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  .conv-item:hover, .conv-item.active { background: var(--accent-soft); }
  .conv-avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #8b5cf6); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; overflow: hidden; flex-shrink: 0; }
  .conv-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .conv-text { flex: 1; min-width: 0; }
  .conv-item .who { font-weight: 600; font-size: 14px; }
  .conv-item .preview { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .unread-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
  .archived-toggle { padding: 10px 16px; font-size: 12px; color: var(--muted); cursor: pointer; border-top: 1px solid var(--border); }
  .archived-toggle:hover { background: var(--accent-soft); }
  #chat-area { flex: 1; display: flex; flex-direction: column; }
  #chat-header { padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .header-title-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .header-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-actions { display: flex; gap: 4px; }
  #disappear-panel { background: #14161c; border-bottom: 1px solid var(--border); padding: 14px 20px; }
  .disappear-opt { display: block; width: 100%; text-align: left; background: transparent; color: var(--text); padding: 8px 4px; font-weight: 400; margin: 0; }
  .disappear-opt:hover { background: var(--accent-soft); }
  .icon-btn { width: auto; background: transparent; padding: 6px 10px; font-size: 16px; margin: 0; }
  .icon-btn.active-toggle { background: var(--accent-soft); border-radius: 8px; }
  #search-box { padding: 8px 16px; border-bottom: 1px solid var(--border); }
  #search-box input { margin: 0; width: 100%; }
  #group-info-panel { background: #14161c; border-bottom: 1px solid var(--border); padding: 14px 20px; max-height: 240px; overflow-y: auto; }
  .gi-title { font-weight: 600; margin-bottom: 8px; color: var(--muted); font-size: 12px; text-transform: uppercase; }
  .gi-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 14px; }
  .gi-remove { width: auto; background: #3a1f24; color: #f87171; padding: 4px 10px; font-size: 12px; margin: 0; }
  .gi-add { display: flex; gap: 6px; margin-top: 10px; }
  .gi-add input { margin: 0; flex: 1; }
  .gi-add button { width: auto; padding: 8px 12px; }
  .di-action { display: block; width: 100%; text-align: left; background: transparent; color: var(--text); padding: 10px 4px; font-weight: 400; margin: 0; border-top: 1px solid var(--border); }
  .di-action:hover { background: var(--accent-soft); }
  #direct-info-panel { background: #14161c; border-bottom: 1px solid var(--border); padding: 14px 20px; }
  #reply-preview { padding: 8px 20px; background: var(--border); border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .reply-text { font-size: 12px; color: var(--muted); }
  #cancel-reply { width: auto; background: transparent; color: var(--muted); padding: 2px 8px; margin: 0; }
  .reply-quote { font-size: 11px; opacity: 0.7; border-left: 2px solid var(--accent); padding-left: 6px; margin-bottom: 4px; }
  .msg-image { max-width: 220px; border-radius: 10px; display: block; cursor: pointer; margin-bottom: 4px; }
  .msg-audio { max-width: 220px; height: 36px; }
  .location-preview { width: 220px; height: 140px; border: none; border-radius: 10px; display: block; margin-bottom: 4px; }
  .contact-card { background: #ffffff14; border-radius: 8px; padding: 10px; min-width: 160px; }
  .poll-box { min-width: 200px; }
  .poll-question { font-weight: 600; margin-bottom: 8px; }
  .poll-option { position: relative; background: #ffffff14; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; overflow: hidden; }
  .poll-option.voted { outline: 2px solid var(--accent); }
  .poll-bar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent-soft); z-index: 0; transition: width 0.3s; }
  .poll-label, .poll-count { position: relative; z-index: 1; }
  .poll-count { float: right; font-size: 11px; opacity: 0.7; }
  #mic-btn.recording { background: #ef4444; color: white; }
  #recording-indicator { color: #ef4444; font-size: 13px; display: flex; align-items: center; padding: 0 6px; white-space: nowrap; }
  .msg-file { color: inherit; text-decoration: underline; font-size: 13px; }
  .caption { margin-top: 4px; }
  .bubble { position: relative; }
  .bubble-actions { display: none; position: absolute; top: -22px; right: 4px; gap: 6px; background: var(--border); border-radius: 8px; padding: 2px 6px; font-size: 12px; }
  .bubble:hover .bubble-actions { display: flex; }
  .bubble-actions span { cursor: pointer; opacity: 0.8; }
  .bubble-actions span:hover { opacity: 1; }
  .act-star.starred { opacity: 1; filter: drop-shadow(0 0 2px gold); }
  .star-marker { position: absolute; top: -6px; left: -6px; font-size: 11px; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 60%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; }
  .bubble.me { align-self: flex-end; background: var(--bubble-me); color: white; border-bottom-right-radius: 4px; }
  .bubble.them { align-self: flex-start; background: var(--bubble-them); border-bottom-left-radius: 4px; }
  .bubble .time { display: block; font-size: 10px; opacity: 0.6; margin-top: 4px; }
  .bubble .sender { display: block; font-size: 11px; font-weight: 600; color: var(--accent); margin-bottom: 3px; }
  #composer { padding: 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; position: relative; }
  #emoji-picker-box { position: absolute; bottom: 100%; left: 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 8px; margin-bottom: 6px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; width: 260px; box-shadow: 0 10px 30px #0006; z-index: 10; }
  #emoji-picker-box span { cursor: pointer; font-size: 18px; text-align: center; padding: 2px; border-radius: 4px; }
  #emoji-picker-box span:hover { background: var(--accent-soft); }
  #plus-menu { position: absolute; bottom: 100%; left: 60px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 6px; box-shadow: 0 10px 30px #0006; z-index: 10; display: flex; flex-direction: column; }
  #plus-menu button { width: auto; background: transparent; color: var(--text); padding: 10px 16px; text-align: left; font-weight: 400; margin: 0; }
  #plus-menu button:hover { background: var(--accent-soft); }
  #composer input { margin: 0; flex: 1; }
  #composer button { width: auto; padding: 12px 20px; }
  #empty-state { margin: auto; color: var(--muted); text-align: center; }
</style>
</head>
<body>

<div id="auth-screen">
  <h1>Weavo</h1>
  <p class="tag">One World. One Communication Layer.</p>
  <input id="reg-username" placeholder="Username" autocomplete="username" />
  <input id="reg-email" placeholder="Email" autocomplete="email" />
  <input id="reg-password" type="password" placeholder="Password (किमान 6 अक्षरं)" autocomplete="current-password" />
  <button id="login-btn">Login</button>
  <button id="register-btn" class="secondary">नवीन खातं तयार करा</button>
  <div id="error"></div>
</div>

<div id="app">
  <div id="sidebar">
    <div id="me-bar">
      <div class="left">
        <div id="me-avatar">?</div>
        <span class="name" id="me-name"></span>
      </div>
      <div class="right">
        <button class="icon-btn" id="settings-btn" title="Settings">⚙</button>
        <button class="logout" id="logout-btn">Logout</button>
      </div>
    </div>
    <input type="file" id="avatar-input" accept="image/*" style="display:none" />
    <div id="settings-panel">
      <label><input type="checkbox" id="hide-last-seen-toggle" /> माझं last-seen लपवा (मग तुम्हालाही इतरांचं दिसणार नाही)</label>
      <label><input type="checkbox" id="hide-read-receipts-toggle" /> माझ्या Read Receipts (✓✓) लपवा (मग तुम्हालाही इतरांचं दिसणार नाही)</label>
      <div class="settings-row">
        <button id="theme-toggle-btn">🌙 Dark / ☀️ Light बदला</button>
      </div>
      <div class="settings-row" id="notif-settings-row" style="display:none">
        <button id="enable-notif-btn">🔔 Push Notifications चालू करा</button>
        <span id="notif-status" class="settings-label"></span>
      </div>
      <div class="settings-row">
        <label class="settings-label">Account type</label>
        <select id="account-type-select">
          <option value="personal">Personal</option>
          <option value="creator">Creator</option>
          <option value="business">Business</option>
        </select>
      </div>
      <div id="creator-bio-row" class="settings-row" style="display:none">
        <label class="settings-label">Bio</label>
        <textarea id="bio-input" placeholder="स्वतःबद्दल थोडक्यात..." rows="2"></textarea>
        <button id="save-bio-btn">Save Bio</button>
      </div>
      <div id="business-fields" style="display:none">
        <div class="conv-avatar" id="biz-photo-preview" style="width:56px;height:56px;cursor:pointer;"><span>🏢</span></div>
        <input type="file" id="biz-photo-input" accept="image/*" style="display:none" />
        <input id="biz-name" placeholder="Business चं नाव" />
        <input id="biz-category" placeholder="Category (उदा: Restaurant, Salon)" />
        <input id="biz-location" placeholder="Location" />
        <input id="biz-phone" placeholder="Phone" />
        <input id="biz-website" placeholder="Website (optional)" />
        <input id="biz-hours" placeholder="वेळ (उदा: 9am-9pm)" />
        <textarea id="biz-desc" placeholder="वर्णन" rows="2"></textarea>
        <button id="save-business-btn">Business Profile Save करा</button>
      </div>
    </div>
    <div id="global-search-wrap">
      <input id="global-search-input" placeholder="🔍 सगळीकडे शोधा (चॅट्स/लोक)..." />
      <div id="global-search-results" style="display:none"></div>
    </div>
    <div id="new-chat"><input id="new-chat-username" placeholder="username टाका (@ शिवाय)..." /><button id="new-chat-btn">Chat</button></div>
    <div id="tab-row">
      <button id="tab-toggle-group" class="link-btn">+ नवीन Group</button>
      <button id="tab-toggle-channel" class="link-btn">+ नवीन Channel</button>
      <button id="tab-toggle-business" class="link-btn">🏢 Discover Businesses</button>
      <button id="tab-toggle-starred" class="link-btn">⭐ Starred Messages</button>
      <button id="install-app-btn" class="link-btn" style="display:none">📲 App Install करा</button>
      <button id="tab-toggle-discover" class="link-btn">🔍 Discover Channels</button>
    </div>
    <div id="new-group" style="display:none">
      <input id="group-name" placeholder="Group चं नाव" />
      <input id="group-usernames" placeholder="usernames, कॉमाने वेगळे (उदा: raj, priya)" />
      <button id="new-group-btn">Group तयार करा</button>
    </div>
    <div id="new-channel" style="display:none">
      <input id="channel-name" placeholder="Channel चं नाव" />
      <input id="channel-desc" placeholder="छोटं वर्णन (optional)" />

<script>
// ---------- Theme (Light/Dark) — पेज लोड होताच लागू, auth screen लाही ----------

// ---------- Supabase client ----------
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let me = null;             // { id, username }
let activeConv = null;
let messagesChannel = null;
const $ = (id) => document.getElementById(id);
$('theme-toggle-btn').onclick = () => {
  document.body.classList.toggle('light');
  localStorage.setItem('weavo_theme', document.body.classList.contains('light') ? 'light' : 'dark');

// ---------- AUTH ----------
$('register-btn').onclick = async () => {
  $('error').textContent = '';
  const username = normalizeUsername($('reg-username').value);
  const email = $('reg-email').value.trim();
  const password = $('reg-password').value;
  if (!username || !email || !password) { $('error').textContent = 'सगळे field भरा'; return; }

  // username आधीच वापरात आहे का तपासा
  const { data: existing } = await sb.from('profiles').select('id').ilike('username', username).maybeSingle();
  if (existing) { $('error').textContent = 'हे username आधीच वापरात आहे'; return; }

  const { data, error } = await sb.auth.signUp({
    email, password,
    options: { data: { username } } // trigger द्वारे profiles table मध्ये जाईल
  });
  if (error) { $('error').textContent = error.message; return; }
  if (data.user) { me = { id: data.user.id, username }; enterApp(); }
};

$('login-btn').onclick = async () => {
  $('error').textContent = '';
  const email = $('reg-email').value.trim();
  const password = $('reg-password').value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { $('error').textContent = error.message; return; }
  const { data: profile } = await sb.from('profiles').select('username').eq('id', data.user.id).single();
  me = { id: data.user.id, username: profile?.username || email };

};

$('logout-btn').onclick = async () => {
  if (amIInCall) endCall(true);

  if (messagesChannel) sb.removeChannel(messagesChannel);
  if (heartbeatTimer) clearInterval(heartbeatTimer);
  me = null; activeConv = null;
  $('app').classList.remove('active');

// पेज रिलोड झाल्यावर आधीच लॉगिन असेल तर थेट app मध्ये जा
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    const { data: profile } = await sb.from('profiles').select('username').eq('id', session.user.id).single();
    me = { id: session.user.id, username: profile?.username };

// ---------- APP ----------
let myProfile = { avatar_url: null, hide_last_seen: false, hide_read_receipts: false };
let heartbeatTimer = null;

async function enterApp() {
  $('auth-screen').style.display = 'none';
  $('app').classList.add('active');
  $('me-name').textContent = '@' + me.username;
  subscribeRealtime();
  loadConversations();

  // Profile (avatar + privacy setting + account type + bio) आणून display करतो
  const { data: p } = await sb.from('profiles').select('avatar_url, hide_last_seen, hide_read_receipts, account_type, bio').eq('id', me.id).single();
  if (p) {
    myProfile = p; renderMyAvatar();

    $('hide-read-receipts-toggle').checked = !!p.hide_read_receipts;

  // Block केलेल्या लोकांची यादी आणतो

    await sb.from('profiles').update({ hide_last_seen: e.target.checked }).eq('id', me.id);
    myProfile.hide_last_seen = e.target.checked;
  };
  $('hide-read-receipts-toggle').onchange = async (e) => {
    await sb.from('profiles').update({ hide_read_receipts: e.target.checked }).eq('id', me.id);
    myProfile.hide_read_receipts = e.target.checked;
  };
  $('me-avatar').onclick = () => $('avatar-input').click();
  $('avatar-input').onchange = handleAvatarUpload;

  $('account-type-select').onchange = async (e) => {
    const val = e.target.value;
    await sb.from('profiles').update({ account_type: val }).eq('id', me.id);
    updateAccountTypeUI(val);
    if (val === 'business') await loadMyBusinessProfile();
  };
  $('save-bio-btn').onclick = async () => {
    await sb.from('profiles').update({ bio: $('bio-input').value.trim() }).eq('id', me.id);
    alert('Bio save झाली');
  };
  $('save-business-btn').onclick = saveBusinessProfile;
  $('biz-photo-preview').onclick = () => $('biz-photo-input').click();
  $('biz-photo-input').onchange = handleBusinessPhotoUpload;

  setupPushNotifications();
  setupGlobalSearch();
  setupInstallPrompt();
}

// ---------- GLOBAL SEARCH ----------
let globalSearchDebounce = null;
function setupGlobalSearch() {
  $('global-search-input').oninput = (e) => {
    clearTimeout(globalSearchDebounce);
    const q = e.target.value.trim();
    if (!q) { $('global-search-results').style.display = 'none'; return; }
    globalSearchDebounce = setTimeout(() => runGlobalSearch(q), 250);
  };
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#global-search-wrap')) $('global-search-results').style.display = 'none';
  });
}

async function runGlobalSearch(q) {
  const qLower = q.toLowerCase();

  // सध्याच्या चॅट्समध्ये नावाने शोध (client-side, आधीच cache आहे)
  const chatMatches = Object.entries(convTitleCache).filter(([id, title]) => title.toLowerCase().includes(qLower)).slice(0, 5);

  // Username नुसार लोक शोध (server query)
  const { data: people } = await sb.from('profiles').select('id, username').ilike('username', `%${q}%`).neq('id', me.id).limit(5);

  // मेसेज मजकुरात शोध (माझ्या चॅट्समध्ये, server query)
  const myConvIds = Object.keys(convTitleCache);
  let msgMatches = [];
  if (myConvIds.length && q.length >= 2) {
    const { data } = await sb.from('messages').select('id, content, conversation_id, sender_id')
      .in('conversation_id', myConvIds).ilike('content', `%${q}%`).eq('deleted', false).limit(5);
    msgMatches = data || [];
  }

  const box = $('global-search-results');
  let html = '';
  if (chatMatches.length) {
    html += '<div class="gs-section">चॅट्स</div>';
    for (const [id, title] of chatMatches) {
      html += `<div class="gs-item" data-conv="${id}" data-title="${escapeHtml(title)}">${escapeHtml(title)}</div>`;
    }
  }
  if (people && people.length) {
    html += '<div class="gs-section">लोक</div>';
    for (const p of people) {
      html += `<div class="gs-item" data-username="${escapeHtml(p.username)}">@${escapeHtml(p.username)}</div>`;
    }
  }
  if (msgMatches.length) {
    html += '<div class="gs-section">मेसेजेस</div>';
    for (const m of msgMatches) {
      const convTitle = convTitleCache[m.conversation_id] || 'Chat';
      html += `<div class="gs-item" data-msg-conv="${m.conversation_id}" data-msg-title="${escapeHtml(convTitle)}"><b>${escapeHtml(convTitle)}</b>: ${escapeHtml((m.content || '').slice(0, 50))}</div>`;
    }
  }
  if (!html) html = '<div class="gs-item" style="color:var(--muted)">काहीही सापडलं नाही</div>';
  box.innerHTML = html;
  box.style.display = 'block';

  box.querySelectorAll('.gs-item[data-conv]').forEach(el => {
    el.onclick = () => {
      box.style.display = 'none';
      $('global-search-input').value = '';
      // conv-list मधल्या त्याच चॅटचा प्रकार शोधण्यासाठी वापरतो — title वरून प्रकार अंदाजतो
      const title = el.dataset.title;
      const type = title.startsWith('# ') ? 'channel' : title.startsWith('@') ? 'direct' : 'group';
      openConversation(el.dataset.conv, title, type);
    };
  });
  box.querySelectorAll('.gs-item[data-msg-conv]').forEach(el => {
    el.onclick = () => {
      box.style.display = 'none';
      $('global-search-input').value = '';
      const title = el.dataset.msgTitle;
      const type = title.startsWith('# ') ? 'channel' : title.startsWith('@') ? 'direct' : 'group';
      openConversation(el.dataset.msgConv, title, type);
    };
  });
  box.querySelectorAll('.gs-item[data-username]').forEach(el => {
    el.onclick = () => {
      box.style.display = 'none';
      $('global-search-input').value = '';
      $('new-chat-username').value = el.dataset.username;
      $('new-chat-btn').click();
    };
  });
}

// ---------- PUSH NOTIFICATIONS ----------
function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
}

function setupPushNotifications() {
  const supported = 'serviceWorker' in navigator && 'PushManager' in window && VAPID_PUBLIC_KEY;
  if (!supported) return; // VAPID key सेट नसेल किंवा browser support नसेल तर हे फीचर लपवतो

  $('notif-settings-row').style.display = 'flex';

  if (Notification.permission === 'granted') {
    $('notif-status').textContent = 'चालू आहे ✓';
    $('enable-notif-btn').style.display = 'none';
  } else if (Notification.permission === 'denied') {
    $('notif-status').textContent = 'Browser मध्ये बंद केलं आहे';
    $('enable-notif-btn').style.display = 'none';
  }

  $('enable-notif-btn').onclick = async () => {
    try {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') { $('notif-status').textContent = 'परवानगी नाकारली'; return; }

      const reg = await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
      });
      const subJson = sub.toJSON();
      await sb.from('push_subscriptions').upsert({
        user_id: me.id,
        endpoint: subJson.endpoint,
        p256dh: subJson.keys.p256dh,
        auth_key: subJson.keys.auth,
      }, { onConflict: 'user_id,endpoint' });

      $('notif-status').textContent = 'चालू आहे ✓';
      $('enable-notif-btn').style.display = 'none';
    } catch (err) {
      alert('Notifications चालू करता आलं नाही: ' + err.message);
    }
  };
}

// Postgres Changes द्वारे नवीन मेसेज real-time ऐकणे
function subscribeRealtime() {
  messagesChannel = sb
    .channel('messages-listener')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
      const msg = payload.new;
      if (msg.conversation_id === activeConv) {
        renderIncoming(msg);
        if (msg.sender_id !== me.id) markAsRead(activeConv);
      }
      loadConversations();
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'messages' }, (payload) => {
      const msg = payload.new;
      if (msg.deleted) {
        const el = document.querySelector(`[data-msg-id="${msg.id}"]`);
        if (el) el.remove();
      } else if (msg.conversation_id === activeConv) {
        // edit झालेला असेल तर तेवढाच content अपडेट करतो
        const el = document.querySelector(`[data-msg-id="${msg.id}"] .msg-content`);
        if (el && msg.edited) {
          el.innerHTML = `${escapeHtml(msg.content)}<span class="edited-tag"> (edited)</span>`;
        }
      }
      if (msg.conversation_id === activeConv) loadConversations();
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'conversation_members' }, (payload) => {
      const row = payload.new;
      if (row.conversation_id !== activeConv || row.user_id === me.id) return;
      if (activeConvType === 'direct') {
        // समोरच्याने चॅट वाचला (last_read_at अपडेट) — तर आपल्या मेसेजवरचं ✓✓ live अपडेट करतो
        otherLastReadAt = row.last_read_at;
        refreshReadTicks();
      } else if (activeConvType === 'group' || activeConvType === 'channel') {
        activeMemberLastRead[row.user_id] = row.last_read_at;
        refreshGroupReadTicks();
      }
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'message_reactions' }, (payload) => {
      const msgId = (payload.new && payload.new.message_id) || (payload.old && payload.old.message_id);
      if (msgId && document.querySelector(`[data-msg-id="${msgId}"]`)) loadReactionsFor(msgId);
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'poll_votes' }, (payload) => {
      const msgId = (payload.new && payload.new.message_id) || (payload.old && payload.old.message_id);
      if (msgId && document.querySelector(`[data-msg-id="${msgId}"] .poll-box`)) refreshPollUI(msgId);
    })
    .subscribe();
}

let activeConvType = null;
let blockedUserIds = new Set(); // मी block केलेले users (त्यांचे मेसेज दाखवायचे नाहीत)
let renderedMsgCache = {}; // msg_id -> { content, sender_id, media_type } (reply-quote preview साठी)
let activeMembers = {}; // user_id -> username, सध्याच्या conversation पुरतं (group मध्ये नाव दाखवण्यासाठी)
const convTitleCache = {}; // conversation_id -> title (sidebar क्लिकसाठी)

let showArchived = false;

async function loadConversations() {
  const { data: memberRows } = await sb.from('conversation_members').select('conversation_id, last_read_at, muted, pinned, archived').eq('user_id', me.id);
  const ids = (memberRows || []).map(r => r.conversation_id);
  const myMeta = {};
  (memberRows || []).forEach(r => { myMeta[r.conversation_id] = r; });
  const list = $('conv-list');
  list.innerHTML = '';
  if (!ids.length) { renderArchivedToggle(0); return; }

  const { data: convs } = await sb.from('conversations').select('id, type, name, avatar_url').in('id', ids);

  // Direct चॅट्ससाठी समोरच्या व्यक्तीचं username + avatar मिळवतो (group/channel साठी c.name आधीच पुरेसं आहे)
  const directIds = (convs || []).filter(c => c.type === 'direct').map(c => c.id);
  const otherInfo = {}; // conversation_id -> { username, avatar_url }
  if (directIds.length) {
    const { data: otherMembers } = await sb.from('conversation_members')
      .select('conversation_id, user_id, profiles(username, avatar_url)')
      .in('conversation_id', directIds)
      .neq('user_id', me.id);
    for (const row of otherMembers || []) {
      otherInfo[row.conversation_id] = { username: row.profiles?.username || 'Unknown', avatar_url: row.profiles?.avatar_url };
    }
  }

  const rows = [];
  for (const c of convs || []) {
    const { data: lastMsgs } = await sb.from('messages')
      .select('content, created_at, sender_id, media_type').eq('conversation_id', c.id)
      .order('created_at', { ascending: false }).limit(1);
    const last = lastMsgs && lastMsgs[0];
    const meta = myMeta[c.id] || {};

    const title = c.type === 'group' ? (c.name || 'Group')
      : c.type === 'channel' ? ('# ' + (c.name || 'Channel'))
      : ('@' + (otherInfo[c.id]?.username || '...'));
    convTitleCache[c.id] = title;

    rows.push({
      id: c.id, type: c.type, title, last,
      isUnread: !!(last && last.sender_id !== me.id && (!meta.last_read_at || new Date(last.created_at) > new Date(meta.last_read_at))),
      isMuted: !!meta.muted, isPinned: !!meta.pinned, isArchived: !!meta.archived,
      avatarUrl: c.type === 'direct' ? otherInfo[c.id]?.avatar_url : c.avatar_url,
      lastTime: last ? new Date(last.created_at).getTime() : 0,
    });
  }

  const visible = rows.filter(r => !r.isArchived);
  const archived = rows.filter(r => r.isArchived);
  visible.sort((a, b) => (b.isPinned - a.isPinned) || (b.lastTime - a.lastTime));

  for (const r of visible) list.appendChild(buildConvItemEl(r));
  renderArchivedToggle(archived.length, archived);
}

function buildConvItemEl(r) {
  let previewText = 'अजून मेसेज नाही';
  if (r.last) previewText = r.last.media_type
    ? (r.last.media_type === 'image' ? '📷 फोटो'
      : r.last.media_type === 'audio' ? '🎤 Voice message'
      : r.last.media_type === 'location' ? '📍 Location'
      : r.last.media_type === 'contact' ? '👤 Contact'
      : r.last.media_type === 'poll' ? '📊 Poll'
      : '📎 फाईल')
    : (r.last.content || '');
  const avatarLetter = (r.type === 'channel' ? '#' : r.title.replace('@', '')[0] || '?').toUpperCase();
  const avatarHtml = r.avatarUrl ? `<img src="${r.avatarUrl}" />` : `<span>${escapeHtml(avatarLetter)}</span>`;

  const div = document.createElement('div');
  div.className = 'conv-item' + (r.id === activeConv ? ' active' : '');
  div.innerHTML = `
    <div class="conv-avatar">${avatarHtml}</div>
    <div class="conv-text">
      <div class="who">${r.isPinned ? '📌 ' : ''}${r.title}${r.isMuted ? ' 🔕' : ''}</div>
      <div class="preview">${escapeHtml(previewText)}</div>
    </div>
    ${r.isUnread && !r.isMuted ? '<span class="unread-dot"></span>' : ''}
  `;
  div.onclick = () => openConversation(r.id, r.title, r.type);
  return div;
}

function renderArchivedToggle(count, archivedRows) {
  let el = document.getElementById('archived-toggle-wrap');
  if (el) el.remove();
  if (!count) return;
  const wrap = document.createElement('div');
  wrap.id = 'archived-toggle-wrap';
  const toggle = document.createElement('div');
  toggle.className = 'archived-toggle';
  toggle.textContent = (showArchived ? '▾' : '▸') + ' 🗄 Archived (' + count + ')';
  toggle.onclick = () => { showArchived = !showArchived; loadConversations(); };
  wrap.appendChild(toggle);
  if (showArchived) {
    archivedRows.forEach(r => wrap.appendChild(buildConvItemEl(r)));
  }
  $('conv-list').appendChild(wrap);
}

let replyingTo = null; // { id, content, senderLabel } — reply करताना कोणत्या मेसेजला उत्तर देतोय
let channelCanPost = true; // channel मध्ये मी post करू शकतो का (owner/admin असल्यास true)

let otherDirectUserId = null; // सध्या उघडलेल्या direct चॅट मधल्या समोरच्या व्यक्तीचा id (typing/last-seen साठी)
let activeDisappearingSeconds = null; // सध्याच्या conversation ची disappearing setting (सेकंदात, null = बंद)
let typingChannel = null;
let typingTimeout = null;

async function openConversation(id, title, type) {
  if (amIInCall) { alert('कॉल चालू असताना दुसरा चॅट उघडता येणार नाही — आधी कॉल संपवा'); return; }
  activeConv = id;
  activeConvType = type || 'direct';
  activeMembers = {};
  replyingTo = null;
  otherDirectUserId = null;
  otherLastReadAt = null;
  otherHideReadReceipts = false;
  renderedMsgCache = {};
  loadConversations();
  $('app').classList.add('chat-open'); // मोबाईलवर chat उघडताना sidebar लपवतो
  const area = $('chat-area');
  area.innerHTML = `
    <div id="chat-header">
      <button id="back-btn" class="icon-btn" title="Back">←</button>
      <span class="header-title-wrap"><span class="header-title">${title}</span><span class="last-seen" id="header-last-seen"></span></span>
      <span class="header-actions">
        ${(type === 'direct' || type === 'group') ? '<button id="voice-call-btn" class="icon-btn" title="Voice Call">📞</button><button id="video-call-btn" class="icon-btn" title="Video Call">🎥</button>' : ''}
        <button id="mute-toggle-btn" class="icon-btn" title="Mute">🔔</button>
        <button id="pin-toggle-btn" class="icon-btn" title="Pin">📌</button>
        <button id="archive-toggle-btn" class="icon-btn" title="Archive">🗄</button>
        <button id="search-toggle-btn" class="icon-btn" title="Search in chat">🔍</button>
        <button id="disappear-btn" class="icon-btn" title="Disappearing messages">⏱</button>
        ${(activeConvType === 'group' || activeConvType === 'channel') ? '<button id="group-info-btn" class="icon-btn" title="Members/Info">⋮</button>' : ''}
        ${type === 'direct' ? '<button id="direct-info-btn" class="icon-btn" title="Options">⋮</button>' : ''}
      </span>
    </div>
    <div id="disappear-panel" style="display:none"></div>
    <div id="group-info-panel" style="display:none"></div>
    <div id="direct-info-panel" style="display:none"></div>
    <div id="search-box" style="display:none"><input id="search-input" placeholder="या चॅटमध्ये शोधा (अलीकडचे 200 मेसेज)..." /></div>
    <div id="messages"></div>
    <div id="blocked-notice" style="display:none" class="readonly-note">तुम्ही या व्यक्तीला block केलं आहे — यांचे नवीन मेसेज दिसणार नाहीत.</div>
    <div class="typing-indicator" id="typing-indicator" style="display:none">टाइप करत आहे...</div>
    <div id="reply-preview" style="display:none"></div>
    <div id="composer">
      <button id="emoji-btn" class="icon-btn" title="Emoji">😊</button>
      <div id="emoji-picker-box" style="display:none"></div>
      <button id="attach-btn" class="icon-btn" title="फोटो/फाईल पाठवा">📎</button>
      <input type="file" id="file-input" style="display:none" accept="image/*,.pdf,.doc,.docx,.zip,.txt" />
      <button id="plus-btn" class="icon-btn" title="अजून पर्याय">➕</button>
      <div id="plus-menu" style="display:none">
        <button id="plus-location">📍 Location पाठवा</button>
        <button id="plus-contact">👤 Contact पाठवा</button>
        <button id="plus-poll">📊 Poll तयार करा</button>
      </div>
      <input id="msg-input" placeholder="मेसेज लिहा..." />
      <button id="mic-btn" class="icon-btn" title="Voice message">🎤</button>
      <span id="recording-indicator" style="display:none">● <span id="rec-timer">0:00</span></span>
      <button id="send-btn">पाठवा</button>
    </div>
  `;

  // Disappearing messages सध्याची सेटिंग आणून घेतो
  const { data: convRow } = await sb.from('conversations').select('disappearing_seconds').eq('id', id).single();
  activeDisappearingSeconds = convRow?.disappearing_seconds || null;
  $('disappear-btn').onclick = () => toggleDisappearPanel(id);

  // Group/Channel असेल तर सभासदांची नावं + role आधीच आणून ठेवतो
  if (activeConvType === 'group' || activeConvType === 'channel') {
    await refreshGroupMembers(id);
    $('group-info-btn').onclick = () => toggleGroupInfo(id);

    // Channel मध्ये फक्त owner/admin पोस्ट करू शकतात — बाकीच्यांसाठी composer लपवतो, पण comment करता यावं म्हणून global flag ठेवतो
    if (activeConvType === 'channel') {
      const myRole = activeMemberRoles[me.id];
      channelCanPost = (myRole === 'owner' || myRole === 'admin');
      if (!channelCanPost) {
        $('composer').style.display = 'none';
        const note = document.createElement('div');
        note.className = 'readonly-note';
        note.id = 'channel-readonly-note';
        note.textContent = 'हे broadcast channel आहे — फक्त admins पोस्ट करू शकतात. एखाद्या पोस्टवरच्या ↩ बटणाने तुम्ही comment करू शकता.';
        $('composer').insertAdjacentElement('afterend', note);
      }
    } else {
      channelCanPost = true;
    }
  } else {
    channelCanPost = true;
    // Direct chat: समोरच्या व्यक्तीचा last-seen/online + last_read_at (read receipts साठी) दाखवतो
    const { data: memberRow } = await sb.from('conversation_members')
      .select('user_id, last_read_at, profiles(username, last_seen_at, hide_last_seen, hide_read_receipts)')
      .eq('conversation_id', id).neq('user_id', me.id).maybeSingle();
    if (memberRow) {
      otherDirectUserId = memberRow.user_id;
      otherLastReadAt = memberRow.last_read_at;
      const other = memberRow.profiles;
      otherHideReadReceipts = !!other?.hide_read_receipts;
      if (other && !other.hide_last_seen && !myProfile.hide_last_seen) {
        const lastSeen = new Date(other.last_seen_at);
        const isOnline = (Date.now() - lastSeen.getTime()) < 2 * 60 * 1000;
        $('header-last-seen').textContent = isOnline ? ' • ऑनलाइन' : ' • शेवटचं ' + lastSeen.toLocaleTimeString('mr-IN', { hour: '2-digit', minute: '2-digit' });
      }
    }
  }

  // Typing indicator + Calling (WebRTC signaling) — दोन्हीसाठी हाच एक broadcast channel वापरतो
  if (typingChannel) sb.removeChannel(typingChannel);
  typingChannel = sb.channel('typing-' + id)
    .on('broadcast', { event: 'typing' }, (payload) => {
      if (payload.payload.user_id === me.id) return;
      const ind = $('typing-indicator');
      if (!ind) return;
      ind.style.display = 'block';
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => { ind.style.display = 'none'; }, 3000);
    })
    .on('broadcast', { event: 'call-join' }, (msg) => {
      const p = msg.payload;
      if (p.from === me.id) return;
      handleCallJoin(id, title, p);
    })
    .on('broadcast', { event: 'call-offer' }, (msg) => {
      const p = msg.payload;
      if (p.from === me.id) return;
      handleCallOffer(p);
    })
    .on('broadcast', { event: 'call-answer' }, (msg) => {
      const p = msg.payload;
      if (p.from === me.id) return;
      handleCallAnswer(p);
    })
    .on('broadcast', { event: 'call-ice' }, (msg) => {
      const p = msg.payload;
      if (p.from === me.id) return;
      handleCallIce(p);
    })
    .on('broadcast', { event: 'call-leave' }, (msg) => {
      const p = msg.payload;
      if (p.from === me.id) return;
      handleCallLeave(p);
    })
    .subscribe();

  if (type === 'direct' || type === 'group') {
    $('voice-call-btn').onclick = () => startCall(id, title, 'audio');
    $('video-call-btn').onclick = () => startCall(id, title, 'video');
  }

  // Mute/Pin/Archive toggles — सध्याच्या conversation साठी माझी स्थिती आणतो
  const { data: myMemberRow } = await sb.from('conversation_members').select('muted, pinned, archived').eq('conversation_id', id).eq('user_id', me.id).maybeSingle();
  let isMuted = !!myMemberRow?.muted;
  let isPinned = !!myMemberRow?.pinned;
  $('mute-toggle-btn').textContent = isMuted ? '🔕' : '🔔';
  $('mute-toggle-btn').onclick = async () => {
    isMuted = !isMuted;
    await sb.from('conversation_members').update({ muted: isMuted }).eq('conversation_id', id).eq('user_id', me.id);
    $('mute-toggle-btn').textContent = isMuted ? '🔕' : '🔔';
    loadConversations();
  };
  $('pin-toggle-btn').classList.toggle('active-toggle', isPinned);
  $('pin-toggle-btn').onclick = async () => {
    isPinned = !isPinned;
    await sb.from('conversation_members').update({ pinned: isPinned }).eq('conversation_id', id).eq('user_id', me.id);
    $('pin-toggle-btn').classList.toggle('active-toggle', isPinned);
    loadConversations();
  };
  $('archive-toggle-btn').onclick = async () => {
    if (!confirm('हा चॅट Archive करायचा? (परत Archived विभागातून बघता येईल)')) return;
    await sb.from('conversation_members').update({ archived: true }).eq('conversation_id', id).eq('user_id', me.id);
    $('app').classList.remove('chat-open');
    $('chat-area').innerHTML = '<div id="empty-state">डावीकडून चॅट निवडा किंवा नवीन सुरू करा</div>';
    loadConversations();
  };
  $('search-toggle-btn').onclick = () => toggleInChatSearch();

  // Direct chat: Block/Report मेनू
  if (type === 'direct' && otherDirectUserId) {

    if (blockedUserIds.has(otherDirectUserId)) {

      $('composer').style.display = 'none';

  }

  const { data: history } = await sb.from('messages').select('*').eq('conversation_id', id)
    .or(`expires_at.is.null,expires_at.gt.${new Date().toISOString()}`)
    .order('created_at', { ascending: true }).limit(200);
  const deletedForMe = getDeletedForMeSet();
  for (const m of history || []) { if (!deletedForMe.has(m.id)) renderIncoming(m); }
  await markAsRead(id);
  refreshReadTicks();
  refreshGroupReadTicks();

  $('send-btn').onclick = sendMessage;
  $('msg-input').onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };

  $('msg-input').oninput = () => {
    clearTimeout(typingDebounce);
    typingDebounce = setTimeout(() => {
      typingChannel.send({ type: 'broadcast', event: 'typing', payload: { user_id: me.id } });
    }, 200);
  };
  $('attach-btn').onclick = () => $('file-input').click();
  $('back-btn').onclick = () => { $('app').classList.remove('chat-open'); };
  $('mic-btn').onclick = toggleVoiceRecording;
  $('file-input').onchange = handleFileUpload;
  $('emoji-btn').onclick = toggleEmojiPicker;
  $('plus-btn').onclick = () => { $('plus-menu').style.display = $('plus-menu').style.display === 'none' ? 'flex' : 'none'; };
  $('plus-location').onclick = sendLocation;
  $('plus-contact').onclick = openContactSharePicker;
  $('plus-poll').onclick = openPollCreator;
}

function otherInfoUsername(title) {

// ============================================================
// WEBRTC CALLING (Voice/Video) — signaling Supabase broadcast वरून,
// media direct peer-to-peer (कोणताही मीडिया सर्व्हरवर साठवला जात नाही)
// ============================================================
// STUN (मोफत, Google) + TURN (मोफत Open Relay Project — कडक/corporate नेटवर्कवर सुद्धा कॉल जोडला जाण्यासाठी)
// टीप: हे सार्वजनिक demo credentials आहेत, उच्च-वापरासाठी विश्वासार्ह नाहीत; मोठ्या प्रमाणावर वापरासाठी स्वतःचा coturn किंवा paid TURN service (Twilio/Metered) घ्यावा.
const ICE_SERVERS = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' },
    { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
  ],
};

// कमी resolution/bitrate — कमकुवत नेटवर्क किंवा दूरच्या TURN relay वरून जाताना lag कमी करण्यासाठी
function getMediaConstraints(isVideo) {
  return {
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    video: isVideo ? { width: { ideal: 640, max: 640 }, height: { ideal: 480, max: 480 }, frameRate: { ideal: 24, max: 24 } } : false,
  };
}

// Peer connection ला bitrate-cap लावतो (विशेषतः video साठी) — यामुळे buffering/lag कमी होतो
async function capVideoBitrate(pc, kbps = 400) {
  const sender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
  if (!sender) return;
  const params = sender.getParameters();
  if (!params.encodings) params.encodings = [{}];
  params.encodings[0].maxBitrate = kbps * 1000;
  try { await sender.setParameters(params); } catch (e) { /* काही ब्राउझर support करत नाहीत, दुर्लक्ष */ }
}

let peers = {}; // userId -> RTCPeerConnection (mesh: प्रत्येक इतर सभासदासाठी वेगळं connection)
let localStream = null;
let amIInCall = false;
let currentCallConvId = null;
let currentCallTitle = null;
let currentCallType = null;
let showingIncomingFor = null; // कोणाचा ring popup सध्या दाखवतोय (डुप्लिकेट टाळण्यासाठी)
let pendingCallInfo = null;
let callTimerInterval = null;

function createPeerConnectionFor(uid) {
  const conn = new RTCPeerConnection(ICE_SERVERS);
  conn.onicecandidate = (e) => {
    if (e.candidate) typingChannel.send({ type: 'broadcast', event: 'call-ice', payload: { from: me.id, to: uid, candidate: e.candidate } });
  };
  conn.ontrack = (e) => addRemoteTile(uid, e.streams[0]);
  conn.onconnectionstatechange = () => {
    if (['disconnected', 'failed', 'closed'].includes(conn.connectionState)) removePeer(uid);
  };
  if (localStream) localStream.getTracks().forEach(t => conn.addTrack(t, localStream));
  peers[uid] = conn;
  return conn;
}

async function offerTo(uid) {
  const conn = createPeerConnectionFor(uid);
  await capVideoBitrate(conn);
  const offer = await conn.createOffer();
  await conn.setLocalDescription(offer);
  typingChannel.send({ type: 'broadcast', event: 'call-offer', payload: { from: me.id, to: uid, sdp: offer } });
}

// कॉल सुरू करणे: स्वतः "join" होतो + बाकीच्यांना ring पाठवतो (1:1 आणि group दोन्हीसाठी हाच मार्ग)
async function startCall(convId, title, type) {
  if (amIInCall) { alert('आधीच एक कॉल सुरू आहे'); return; }
  try {
    localStream = await navigator.mediaDevices.getUserMedia(getMediaConstraints(type === 'video'));
  } catch (err) {
    alert('Microphone/Camera access मिळालं नाही: ' + err.message);
    return;
  }
  amIInCall = true;
  currentCallConvId = convId;
  currentCallTitle = title;
  currentCallType = type;
  showActiveCallUI(type, 'इतरांची वाट बघतोय...');
  typingChannel.send({ type: 'broadcast', event: 'call-join', payload: { from: me.id, callType: type, fromName: me.username } });
}

// कोणीतरी join झाल्याचं ऐकल्यावर: मी आधीच कॉलवर असेन तर त्यांना offer पाठवतो (mesh तयार होतो);
// नसेन तर हा त्यांचा "ring" समजून incoming-call popup दाखवतो
function handleCallJoin(convId, title, payload) {
  if (payload.from === me.id) return;
  if (currentCallConvId && currentCallConvId !== convId) return; // वेगळ्या चॅटमधला कॉल असेल तर दुर्लक्ष

  if (amIInCall) {
    if (!peers[payload.from]) offerTo(payload.from);
  } else {
    if (showingIncomingFor === payload.from) return;
    showingIncomingFor = payload.from;
    pendingCallInfo = { convId, title, callType: payload.callType };
    $('incoming-call-text').textContent = '@' + (payload.fromName || 'कोणीतरी') + ' — ' + (payload.callType === 'video' ? 'Video' : 'Voice') + ' कॉल करतोय';
    $('incoming-call-overlay').style.display = 'flex';
  }
}

async function acceptCall() {
  $('incoming-call-overlay').style.display = 'none';
  if (!pendingCallInfo) return;
  const { convId, title, callType } = pendingCallInfo;
  try {
    localStream = await navigator.mediaDevices.getUserMedia(getMediaConstraints(callType === 'video'));
  } catch (err) {
    alert('Microphone/Camera access मिळालं नाही: ' + err.message);
    declineCall();
    return;
  }
  amIInCall = true;
  currentCallConvId = convId;
  currentCallTitle = title;
  currentCallType = callType;
  showActiveCallUI(callType, 'कॉल सुरू आहे');
  startCallTimer();
  typingChannel.send({ type: 'broadcast', event: 'call-join', payload: { from: me.id, callType, fromName: me.username } });
  showingIncomingFor = null;
  pendingCallInfo = null;
}

function declineCall() {
  $('incoming-call-overlay').style.display = 'none';
  showingIncomingFor = null;
  pendingCallInfo = null;
}

function handleCallOffer(payload) {
  if (payload.to !== me.id) return;
  const conn = peers[payload.from] || createPeerConnectionFor(payload.from);
  (async () => {
    await capVideoBitrate(conn);
    await conn.setRemoteDescription(new RTCSessionDescription(payload.sdp));
    const answer = await conn.createAnswer();
    await conn.setLocalDescription(answer);
    typingChannel.send({ type: 'broadcast', event: 'call-answer', payload: { from: me.id, to: payload.from, sdp: answer } });
  })();
}

function handleCallAnswer(payload) {
  if (payload.to !== me.id) return;
  const conn = peers[payload.from];
  if (conn) conn.setRemoteDescription(new RTCSessionDescription(payload.sdp));
  $('call-status').textContent = 'कॉल सुरू आहे';
  if (!callTimerInterval) startCallTimer();
}

function handleCallIce(payload) {
  if (payload.to !== me.id) return;
  const conn = peers[payload.from];
  if (conn) conn.addIceCandidate(new RTCIceCandidate(payload.candidate)).catch(() => {});
}

function handleCallLeave(payload) {
  removePeer(payload.from);
}

function removePeer(uid) {
  if (peers[uid]) { peers[uid].close(); delete peers[uid]; }
  const tile = document.getElementById('remote-tile-' + uid);
  if (tile) tile.remove();
}

function addRemoteTile(uid, stream) {
  let tile = document.getElementById('remote-tile-' + uid);
  let video;
  if (!tile) {
    tile = document.createElement('div');
    tile.className = 'video-tile';
    tile.id = 'remote-tile-' + uid;
    video = document.createElement('video');
    video.autoplay = true; video.playsInline = true;
    tile.appendChild(video);
    $('video-grid').appendChild(tile);
  } else {
    video = tile.querySelector('video');
  }
  if (video.srcObject !== stream) video.srcObject = stream;
}

function showActiveCallUI(type, statusText) {
  $('active-call-overlay').style.display = 'flex';
  $('active-call-overlay').classList.toggle('audio-only', type !== 'video');
  $('call-status').textContent = statusText;
  if (localStream) $('local-video').srcObject = localStream;

  $('mute-btn').onclick = () => {
    const audioTrack = localStream.getAudioTracks()[0];
    if (!audioTrack) return;
    audioTrack.enabled = !audioTrack.enabled;
    $('mute-btn').classList.toggle('muted', !audioTrack.enabled);
  };
  $('camera-btn').onclick = () => {
    const videoTrack = localStream.getVideoTracks()[0];
    if (!videoTrack) return;
    videoTrack.enabled = !videoTrack.enabled;
    $('camera-btn').classList.toggle('muted', !videoTrack.enabled);
  };
  $('hangup-btn').onclick = () => endCall(true);
}

function startCallTimer() {
  let seconds = 0;
  clearInterval(callTimerInterval);
  callTimerInterval = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    $('call-status').textContent = `${m}:${s}`;
  }, 1000);
}

function endCall(notifyPeer) {
  clearInterval(callTimerInterval); callTimerInterval = null;
  if (notifyPeer && typingChannel && amIInCall) typingChannel.send({ type: 'broadcast', event: 'call-leave', payload: { from: me.id } });
  Object.keys(peers).forEach(uid => { peers[uid].close(); });
  peers = {};
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  document.querySelectorAll('.video-tile[id^="remote-tile-"]').forEach(el => el.remove());
  $('active-call-overlay').style.display = 'none';
  $('incoming-call-overlay').style.display = 'none';
  $('local-video').srcObject = null;
  amIInCall = false;
  currentCallConvId = null;
  currentCallType = null;
  showingIncomingFor = null;
  pendingCallInfo = null;
}

$('accept-call-btn').onclick = acceptCall;
$('decline-call-btn').onclick = declineCall;

// ---------- GROUP INFO PANEL ----------
let activeMemberRoles = {}; // user_id -> role, आणि सोबत activeMembers मध्ये username
let activeMemberLastRead = {}; // user_id -> last_read_at (group read receipts साठी)

async function refreshGroupMembers(convId) {
  const { data: members } = await sb.from('conversation_members')
    .select('user_id, role, last_read_at, profiles(username)').eq('conversation_id', convId);
  activeMembers = {}; activeMemberRoles = {}; activeMemberLastRead = {};
  for (const m of members || []) {
    activeMembers[m.user_id] = m.profiles?.username || 'Unknown';
    activeMemberRoles[m.user_id] = m.role;
    activeMemberLastRead[m.user_id] = m.last_read_at;
  }
}

function groupReadCount(msgCreatedAt) {
  const t = new Date(msgCreatedAt).getTime();
  let count = 0;
  for (const [uid, lastRead] of Object.entries(activeMemberLastRead)) {
    if (uid === me.id) continue;
    if (lastRead && new Date(lastRead).getTime() >= t) count++;
  }
  return count;
}

// ---------- IN-CHAT SEARCH ----------
function toggleInChatSearch() {
  const box = $('search-box');
  const willOpen = box.style.display === 'none';
  box.style.display = willOpen ? 'block' : 'none';
  if (!willOpen) {
    $('search-input').value = '';
    filterMessagesBySearch('');
    return;
  }
  $('search-input').focus();
  $('search-input').oninput = (e) => filterMessagesBySearch(e.target.value.trim().toLowerCase());
}

function filterMessagesBySearch(query) {
  const bubbles = document.querySelectorAll('#messages .bubble');
  let firstMatch = null;
  bubbles.forEach(b => {
    const textEl = b.querySelector('.msg-content, .caption, .msg-file');
    const text = (textEl ? textEl.textContent : '').toLowerCase();
    const matches = !query || text.includes(query);
    b.style.display = matches ? 'block' : 'none';
    if (matches && query && !firstMatch) firstMatch = b;
  });
  if (firstMatch) firstMatch.scrollIntoView({ block: 'center' });
}

// ---------- FORWARD ----------
async function openForwardPicker(msg) {
  const { data: memberRows } = await sb.from('conversation_members')
    .select('conversation_id, role, conversations(type)').eq('user_id', me.id);
  // Channel असेल आणि मी owner/admin नसेन, तर तिथे forward करता येणार नाही (post करण्याचा अधिकार नाही) — त्यामुळे यादीतूनच वगळतो
  const candidates = (memberRows || []).filter(r => {
    if (r.conversation_id === activeConv) return false;
    if (r.conversations?.type === 'channel') return r.role === 'owner' || r.role === 'admin';
    return true;
  }).map(r => r.conversation_id);

  if (!candidates.length) { alert('Forward करण्यासाठी दुसरा (पोस्ट करता येईल असा) चॅट नाही'); return; }

  const overlay = document.createElement('div');
  overlay.className = 'call-overlay';
  overlay.id = 'forward-overlay';
  const box = document.createElement('div');
  box.className = 'call-box';
  box.innerHTML = '<div class="call-name">कुठे Forward करायचं?</div><div id="forward-list" style="max-height:260px; overflow-y:auto; margin-top:10px;"></div><button id="forward-cancel" class="call-btn decline" style="margin-top:12px;">रद्द करा</button>';
  overlay.appendChild(box);
  document.body.appendChild(overlay);

  const listEl = box.querySelector('#forward-list');
  for (const id of candidates) {
    const t = convTitleCache[id] || 'Chat';
    const btn = document.createElement('button');
    btn.className = 'disc-join';
    btn.style.cssText = 'width:100%; margin-top:6px; text-align:left;';
    btn.textContent = t;
    btn.onclick = async () => {
      const { error } = await sb.from('messages').insert({
        conversation_id: id, sender_id: me.id,
        content: msg.content || '', media_url: msg.media_url || null, media_type: msg.media_type || null,
      });
      if (error) { alert('Forward करता आलं नाही: ' + error.message); return; }
      overlay.remove();
      alert(t + ' ला forward केलं');
    };
    listEl.appendChild(btn);
  }
  box.querySelector('#forward-cancel').onclick = () => overlay.remove();
}

function toggleDisappearPanel(convId) {
  const panel = $('disappear-panel');
  if (panel.style.display !== 'none') { panel.style.display = 'none'; return; }

  const options = [
    { label: 'बंद', value: '' },
    { label: '24 तास', value: 86400 },
    { label: '7 दिवस', value: 604800 },
  ];
  panel.innerHTML = `<div class="gi-title">Disappearing Messages (जुने मेसेज आपोआप डिलीट)</div>` +
    options.map(o => `<button class="disappear-opt" data-val="${o.value}">${o.label}${activeDisappearingSeconds == o.value || (!activeDisappearingSeconds && !o.value) ? ' ✓' : ''}</button>`).join('');
  panel.style.display = 'block';

  panel.querySelectorAll('.disappear-opt').forEach(btn => {
    btn.onclick = async () => {
      const val = btn.dataset.val ? parseInt(btn.dataset.val) : null;
      const { error } = await sb.from('conversations').update({ disappearing_seconds: val }).eq('id', convId);
      if (error) { alert(error.message); return; }
      activeDisappearingSeconds = val;
      panel.style.display = 'none';
    };
  });
}

// ---------- DIRECT CHAT INFO (Block/Report) ----------
function toggleDirectInfoPanel(otherUserId, otherUsername) {
  const panel = $('direct-info-panel');
  if (panel.style.display !== 'none') { panel.style.display = 'none'; return; }

  const isBlocked = blockedUserIds.has(otherUserId);
  panel.innerHTML = `
    <div class="gi-row"><span>@${escapeHtml(otherUsername)}</span></div>
    <button class="di-action" id="di-block-btn">${isBlocked ? '✅ Unblock करा' : '🚫 Block करा'}</button>
    <button class="di-action" id="di-report-btn">⚠️ Report करा</button>
  `;
  panel.style.display = 'block';

  $('di-block-btn').onclick = async () => {
    if (isBlocked) {
      await sb.from('blocked_users').delete().eq('blocker_id', me.id).eq('blocked_id', otherUserId);
      blockedUserIds.delete(otherUserId);
      alert('Unblock केलं');
    } else {
      if (!confirm('@' + otherUsername + ' ला block करायचं?')) return;
      await sb.from('blocked_users').insert({ blocker_id: me.id, blocked_id: otherUserId });
      blockedUserIds.add(otherUserId);
      alert('Block केलं');
    }
    panel.style.display = 'none';
    $('blocked-notice').style.display = blockedUserIds.has(otherUserId) ? 'block' : 'none';
    $('composer').style.display = blockedUserIds.has(otherUserId) ? 'none' : 'flex';
    document.querySelectorAll(`.bubble[data-sender="${otherUserId}"]`).forEach(el => el.style.display = blockedUserIds.has(otherUserId) ? 'none' : 'flex');
  };

  $('di-report-btn').onclick = async () => {
    const category = prompt('कारण लिहा (उदा: Spam, Harassment, Fraud, इ.):');
    if (!category) return;
    const { error } = await sb.from('reports').insert({ reporter_id: me.id, target_type: 'user', target_id: otherUserId, category });
    if (error) { alert(error.message); return; }
    alert('Report पाठवला गेला, धन्यवाद.');
    panel.style.display = 'none';
  };
}

function toggleGroupInfo(convId) {
  const panel = $('group-info-panel');
  if (panel.style.display !== 'none') { panel.style.display = 'none'; return; }

  const isOwner = activeMemberRoles[me.id] === 'owner';
  const isOwnerOrAdmin = isOwner || activeMemberRoles[me.id] === 'admin';
  let html = '';
  if (isOwner) {
    html += `<div class="gi-title">Group Avatar</div>
      <div class="conv-avatar" id="gi-avatar-preview" style="width:56px;height:56px;cursor:pointer;margin-bottom:10px;"><span>?</span></div>
      <input type="file" id="gi-avatar-input" accept="image/*" style="display:none" />`;
  }
  html += '<div class="gi-title">सभासद</div>';
  for (const [uid, uname] of Object.entries(activeMembers)) {
    const role = activeMemberRoles[uid];
    html += `<div class="gi-row"><span>@${escapeHtml(uname)}${role === 'owner' ? ' (owner)' : ''}</span>`;
    if (isOwner && uid !== me.id) html += `<button class="gi-remove" data-uid="${uid}">काढा</button>`;
    html += `</div>`;
  }
  if (isOwnerOrAdmin) {
    html += `<div class="gi-add"><input id="gi-add-input" placeholder="username (नवीन सभासद)" /><button id="gi-add-btn">जोडा</button></div>`;
  }
  panel.innerHTML = html;
  panel.style.display = 'block';

  if (isOwner) {
    sb.from('conversations').select('avatar_url').eq('id', convId).single().then(({ data }) => {
      if (data?.avatar_url) $('gi-avatar-preview').innerHTML = `<img src="${data.avatar_url}" />`;
    });
    $('gi-avatar-preview').onclick = () => $('gi-avatar-input').click();
    $('gi-avatar-input').onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const ext = file.name.split('.').pop();
      const path = `group-avatars/${convId}-${Date.now()}.${ext}`;
      const { error: upErr } = await sb.storage.from('chat-media').upload(path, file);
      if (upErr) { alert(upErr.message); return; }
      const { data: pub } = sb.storage.from('chat-media').getPublicUrl(path);
      await sb.from('conversations').update({ avatar_url: pub.publicUrl }).eq('id', convId);
      $('gi-avatar-preview').innerHTML = `<img src="${pub.publicUrl}" />`;
      loadConversations();
    };
  }

  panel.querySelectorAll('.gi-remove').forEach(btn => {
    btn.onclick = async () => {
      const uid = btn.dataset.uid;
      const { error } = await sb.from('conversation_members').delete().eq('conversation_id', convId).eq('user_id', uid);
      if (error) { alert(error.message); return; }
      await refreshGroupMembers(convId);
      toggleGroupInfo(convId); toggleGroupInfo(convId); // पॅनल refresh
    };
  });

  if (!isOwnerOrAdmin) return; // add-member handlers फक्त owner/admin साठी लागतात
  $('gi-add-btn').onclick = async () => {
    let uname = normalizeUsername($('gi-add-input').value);
    if (!uname) return;
    const { data: user } = await sb.from('profiles').select('id').ilike('username', uname).maybeSingle();
    if (!user) { alert('वापरकर्ता सापडला नाही'); return; }
    const { error } = await sb.from('conversation_members').insert({ conversation_id: convId, user_id: user.id, role: 'member' });

// ---------- PHOTO/FILE UPLOAD ----------
async function handleFileUpload(e) {
  const file = e.target.files[0];
  if (!file || !activeConv) return;
  if (file.size > 10 * 1024 * 1024) { alert('फाईल 10MB पेक्षा मोठी आहे'); return; }

  const ext = file.name.split('.').pop();
  const path = `${activeConv}/${crypto.randomUUID()}.${ext}`;
  const { error: upErr } = await sb.storage.from('chat-media').upload(path, file);
  if (upErr) { alert('अपलोड चुकलं: ' + upErr.message); return; }

  const { data: pub } = sb.storage.from('chat-media').getPublicUrl(path);
  const mediaType = file.type.startsWith('image/') ? 'image' : 'file';

  const { error } = await sb.from('messages').insert({
    conversation_id: activeConv, sender_id: me.id,
    content: mediaType === 'image' ? '' : file.name,
    media_url: pub.publicUrl, media_type: mediaType,
    expires_at: computeExpiresAt(),
  });
  if (error) alert(error.message);
  e.target.value = '';
}

// ---------- VOICE MESSAGES ----------
let mediaRecorder = null;
let audioChunks = [];
let recordingTimerInterval = null;
let recordingSeconds = 0;

async function toggleVoiceRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    return;
  }
  let micStream;
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (err) {
    alert('Microphone access मिळालं नाही: ' + err.message);
    return;
  }
  audioChunks = [];
  mediaRecorder = new MediaRecorder(micStream);
  mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    micStream.getTracks().forEach(t => t.stop());
    clearInterval(recordingTimerInterval);
    $('recording-indicator').style.display = 'none';
    $('mic-btn').classList.remove('recording');
    recordingSeconds = 0;
    const blob = new Blob(audioChunks, { type: 'audio/webm' });
    if (blob.size < 500) return; // खूप छोटं (चुकून क्लिक) असेल तर पाठवायचं नाही
    await uploadAndSendVoice(blob);
  };
  mediaRecorder.start();
  $('mic-btn').classList.add('recording');
  $('recording-indicator').style.display = 'inline';
  recordingSeconds = 0;
  $('rec-timer').textContent = '0:00';
  recordingTimerInterval = setInterval(() => {
    recordingSeconds++;
    const m = String(Math.floor(recordingSeconds / 60)).padStart(1, '0');
    const s = String(recordingSeconds % 60).padStart(2, '0');
    $('rec-timer').textContent = `${m}:${s}`;
  }, 1000);
}

async function uploadAndSendVoice(blob) {
  if (!activeConv) return;
  const path = `${activeConv}/voice-${crypto.randomUUID()}.webm`;
  const { error: upErr } = await sb.storage.from('chat-media').upload(path, blob, { contentType: 'audio/webm' });
  if (upErr) { alert('Voice message अपलोड चुकलं: ' + upErr.message); return; }
  const { data: pub } = sb.storage.from('chat-media').getPublicUrl(path);
  const { error } = await sb.from('messages').insert({
    conversation_id: activeConv, sender_id: me.id, content: '',
    media_url: pub.publicUrl, media_type: 'audio',
    expires_at: computeExpiresAt(),
  });
  if (error) alert(error.message);
}

function renderIncoming(msg) {
  const box = $('messages');
  if (!box) return;
  if (msg.deleted) return; // delete झालेला मेसेज दाखवायचा नाही
  if (msg.expires_at && new Date(msg.expires_at) < new Date()) return; // आधीच expire झालेला (cleanup अजून चालला नसेल तर सुद्धा client वर लपवतो)
  if (blockedUserIds.has(msg.sender_id)) return; // block केलेल्या व्यक्तीचा मेसेज दाखवायचा नाही
  if (getDeletedForMeSet().has(msg.id)) return; // मी "फक्त माझ्यासाठी delete" केलेला मेसेज

  const mine = msg.sender_id === me.id;
  const div = document.createElement('div');
  div.className = 'bubble ' + (mine ? 'me' : 'them');
  div.dataset.msgId = msg.id;
  div.dataset.createdAt = msg.created_at;
  div.dataset.sender = msg.sender_id;
  const time = new Date(msg.created_at).toLocaleTimeString('mr-IN', { hour: '2-digit', minute: '2-digit' });
  const senderLabel = (activeConvType !== 'direct' && !mine)
    ? `<span class="sender">${escapeHtml(activeMembers[msg.sender_id] || 'Unknown')}</span>` : '';

  // Reply-quote साठी नंतर उपयोगी पडावं म्हणून cache करतो
  renderedMsgCache[msg.id] = { content: msg.content, sender_id: msg.sender_id, media_type: msg.media_type };

  let bodyHtml = '';
  if (msg.media_url && msg.media_type === 'image') {
    bodyHtml += `<img src="${msg.media_url}" class="msg-image" onclick="window.open('${msg.media_url}','_blank')" />`;
    if (msg.content) bodyHtml += `<div class="caption">${escapeHtml(msg.content)}</div>`;
  } else if (msg.media_url && msg.media_type === 'audio') {
    bodyHtml += `<audio controls src="${msg.media_url}" class="msg-audio"></audio>`;
  } else if (msg.media_type === 'location') {
    const [lat, lng] = msg.content.split(',');
    const delta = 0.01;
    const bbox = `${parseFloat(lng) - delta},${parseFloat(lat) - delta},${parseFloat(lng) + delta},${parseFloat(lat) + delta}`;
    bodyHtml += `<iframe class="location-preview" src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&marker=${lat},${lng}" loading="lazy"></iframe>
    <a href="https://www.openstreetmap.org/?mlat=${lat}&mlon=${lng}#map=16/${lat}/${lng}" target="_blank" class="msg-file">📍 पूर्ण नकाशा उघडा</a>`;
  } else if (msg.media_type === 'contact') {
    bodyHtml += `<div class="contact-card">👤 <b>@${escapeHtml(msg.content)}</b></div>`;
  } else if (msg.media_type === 'poll') {
    let poll = { question: '', options: [] };
    try { poll = JSON.parse(msg.content); } catch (e) {}
    bodyHtml += `<div class="poll-box" data-options='${escapeHtml(JSON.stringify(poll.options))}'>
      <div class="poll-question">📊 ${escapeHtml(poll.question)}</div>
      ${poll.options.map((opt, i) => `
        <div class="poll-option" data-idx="${i}">
          <div class="poll-bar" style="width:0%"></div>
          <span class="poll-label">${escapeHtml(opt)}</span>
          <span class="poll-count">0 (0%)</span>
        </div>
      `).join('')}
    </div>`;
  } else if (msg.media_url) {
    bodyHtml += `<a href="${msg.media_url}" target="_blank" class="msg-file">📎 ${escapeHtml(msg.content || 'फाईल')}</a>`;
  } else {
    bodyHtml += `<span class="msg-content">${escapeHtml(msg.content)}${msg.edited ? '<span class="edited-tag"> (edited)</span>' : ''}</span>`;
  }

  let replyHtml = '';
  if (msg.reply_to) {
    const cached = renderedMsgCache[msg.reply_to];
    replyHtml = `<div class="reply-quote" data-quote-for="${msg.reply_to}">↩ ${cached ? escapeHtml(quotePreviewText(cached)) : 'लोड होतंय...'}</div>`;
    if (!cached) fetchAndFillQuote(msg.reply_to, msg.id);
  }
  let tickHtml = '';
  if (mine && activeConvType === 'direct') {
    tickHtml = `<span class="tick" data-created-at="${msg.created_at}">✓</span>`;
  } else if (mine && (activeConvType === 'group' || activeConvType === 'channel')) {
    const readCount = groupReadCount(msg.created_at);
    tickHtml = readCount > 0 ? `<span class="tick read">✓✓ Read by ${readCount}</span>` : `<span class="tick">✓ Sent</span>`;
  }
  const actionsHtml = `<div class="bubble-actions">
    <span class="act-reply" title="Reply">↩</span>
    <span class="act-forward" title="Forward">↪</span>
    <span class="act-star" title="Star">⭐</span>
    <span class="act-react" title="React">😊</span>
    ${mine && !msg.media_url ? '<span class="act-edit" title="Edit">✏️</span>' : ''}
    <span class="act-delete" title="Delete">🗑</span>
  </div>`;

  div.innerHTML = `${senderLabel}${replyHtml}${bodyHtml}<div class="reaction-pills"></div><span class="time">${time}${tickHtml}</span>${actionsHtml}`;
  div.querySelector('.act-reply').onclick = () => setReplyTarget(msg);
  div.querySelector('.act-forward').onclick = () => openForwardPicker(msg);
  div.querySelector('.act-star').onclick = () => toggleStar(msg.id, div);
  div.querySelector('.act-react').onclick = (e) => toggleReactionPicker(msg.id, div);
  div.querySelector('.act-delete').onclick = () => showDeleteChoice(msg);
  const editBtn = div.querySelector('.act-edit');
  if (editBtn) editBtn.onclick = () => startEditMessage(msg);

  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  checkStarred(msg.id, div);
  loadReactionsFor(msg.id);
  refreshReadTicks();
  refreshGroupReadTicks();

  if (msg.media_type === 'poll') {
    div.querySelectorAll('.poll-option').forEach(optEl => {
      optEl.onclick = () => castPollVote(msg.id, parseInt(optEl.dataset.idx));
    });
    refreshPollUI(msg.id);
  }
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

// "@" काढतो, आणि जास्तीच्या/चुकीच्या स्पेसेस (उदा. डबल-स्पेस) एका स्पेसमध्ये एकत्र करतो —
// यामुळे username मध्ये स्पेस असेल (उदा. "arham gandhi") तरी टायपिंग-चूक माफ केली जाते
function normalizeUsername(s) {
  return (s || '').trim().replace(/^@/, '').replace(/\s+/g, ' ').trim();
}

// ---------- PWA: service worker register करणे ----------
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {
      // सायलेंटली स्किप — service worker नसला तरी app नेहमीसारखं चालेल
    });
  });
}
</script>
