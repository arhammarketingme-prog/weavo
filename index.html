<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weavo — One World. One Communication Layer.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236366f1'/%3E%3Ctext x='50' y='68' font-size='55' font-family='Arial' fill='white' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<meta name="theme-color" content="#6366f1" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.105.0"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --accent: #6366f1; --accent-soft: #6366f122;
    --text: #e9eaee; --muted: #8b8fa3; --bubble-me: #6366f1; --bubble-them: #23262f; --radius: 16px;
    --input-bg: #10121a; --border: #22252e;
  }
  body.light {
    --bg: #f4f5f7; --panel: #ffffff; --accent: #6366f1; --accent-soft: #6366f11a;
    --text: #14161c; --muted: #6b7280; --bubble-me: #6366f1; --bubble-them: #eceef2;
    --input-bg: #f0f1f4; --border: #e5e7eb;
  }
  body.light .bubble.them { color: #14161c; }
  body.light .call-box, body.light #group-info-panel, body.light #discover-panel, body.light #discover-business-panel,
  body.light #new-group, body.light #new-channel, body.light #settings-panel, body.light #direct-info-panel,
  body.light #disappear-panel, body.light .archived-toggle, body.light .reaction-picker { background: var(--panel); }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; }
  #auth-screen { margin: auto; width: min(390px, calc(100vw - 28px)); background: var(--panel); padding: 30px; border-radius: 28px; box-shadow: 0 24px 80px #0009; border: 1px solid var(--border); }
  .auth-logo { width: 58px; height: 58px; margin: 0 auto 16px; border-radius: 19px; display:flex; align-items:center; justify-content:center; background: linear-gradient(135deg, #20c9bd, #159d96); color:#fff; font-size:30px; font-weight:850; box-shadow: 0 14px 34px rgba(32,201,189,.28); }
  #auth-screen h1 { text-align:center; font-size:25px; margin: 0 0 5px; }
  .auth-switch { display:flex; gap:4px; padding:4px; margin: 2px 0 12px; border:1px solid var(--border); border-radius:14px; background:var(--input-bg); }
  .auth-tab { flex:1; width:auto; margin:0; padding:10px; border-radius:10px; background:transparent; color:var(--muted); }
  .auth-tab.active { background:var(--accent); color:#fff; }
  .auth-or { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:11px; margin:13px 0 5px; }
  .auth-or:before,.auth-or:after { content:""; flex:1; height:1px; background:var(--border); }
  .passkey-btn { background: var(--input-bg); color: var(--accent); border:1px solid var(--accent-soft); }
  .passkey-btn:hover { background:var(--accent-soft); }
  .google-auth-btn { display:flex; align-items:center; justify-content:center; gap:10px; background:#ffffff; color:#1e293b; border:1px solid var(--border); margin-top:8px; font-weight:600; cursor:pointer; }
  .google-auth-btn:hover { background:#f8fafc; }
  #auth-screen .secondary { margin-top:10px; }
  input { width: 100%; padding: 12px 14px; margin-bottom: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-size: 14px; }
  input:focus { outline: none; border-color: var(--accent); }
  button { width: 100%; padding: 12px; border-radius: 10px; border: none; cursor: pointer; background: var(--accent); color: white; font-weight: 600; font-size: 14px; margin-top: 4px; }
  button.secondary { background: transparent; color: var(--accent); margin-top: 8px; }
  #error { color: #f87171; font-size: 13px; min-height: 16px; margin-top: 8px; }
  #app { display: none; width: 100%; height: 100vh; }
  #app.active { display: flex; }
  #sidebar { width: 280px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #back-btn { display: none; }
  @media (max-width: 768px) {
    #sidebar { width: 100%; }
    #chat-area { width: 100%; }
    #app.chat-open #sidebar { display: none; }
    #app:not(.chat-open) #chat-area { display: none; }
    #back-btn { display: inline-flex !important; }
  }
  #me-bar { padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  #me-bar .left { display: flex; align-items: center; gap: 10px; }
  #me-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; overflow: hidden; flex-shrink: 0; }
  #me-avatar img { width: 100%; height: 100%; object-fit: cover; }
  #me-bar .name { font-weight: 600; }
  #me-bar button.logout { width: auto; background: transparent; color: var(--muted); padding: 4px 8px; font-size: 12px; }
  #settings-panel { display: none; padding: 14px 16px; background: #14161c; border-bottom: 1px solid var(--border); }
  #global-search-wrap { padding: 10px 16px; border-bottom: 1px solid var(--border); position: relative; }
  #global-search-input { width: 100%; margin: 0; }
  #new-chat { padding: 12px 16px; display: flex; gap: 6px; border-bottom: 1px solid var(--border); }
  #new-chat input { margin: 0; }
  #new-chat button { width: auto; padding: 10px 14px; }
  #tab-row { padding: 8px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; }
  .link-btn { width: auto; background: transparent; color: var(--accent); padding: 4px 0; font-size: 12px; text-align: left; margin: 0; }
  #conv-list { flex: 1; overflow-y: auto; }
  .conv-item { padding: 10px 16px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
  .conv-item:hover, .conv-item.active { background: var(--accent-soft); }
  .conv-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; overflow: hidden; flex-shrink: 0; }
  .conv-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .conv-text { flex: 1; min-width: 0; }
  .conv-item .who { font-weight: 600; font-size: 14px; }
  .conv-item .preview { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #chat-area { flex: 1; display: flex; flex-direction: column; }
  #chat-header { padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; align-items: center; gap: 8px; }
  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 60%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; position: relative; }
  .bubble.me { align-self: flex-end; background: var(--bubble-me); color: white; border-bottom-right-radius: 4px; }
  .bubble.them { align-self: flex-start; background: var(--bubble-them); border-bottom-left-radius: 4px; }
  .bubble .time { display: block; font-size: 10px; opacity: 0.6; margin-top: 4px; }
  #composer { padding: 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; position: relative; }
  #composer input { margin: 0; flex: 1; }
  #composer button { width: auto; padding: 12px 20px; }
  #empty-state { margin: auto; color: var(--muted); text-align: center; }
</style>
</head>
<body>

<div id="landing" style="width:100%; height:100vh; overflow-y:auto; background:var(--bg); padding:40px; text-align:center;">
  <h1 style="font-size:36px; font-weight:800; color:var(--text); margin-top:100px;">Weavo — One World. One Communication</h1>
  <p style="color:var(--muted); font-size:16px;">सुरक्षित आणि जलद कम्युनिकेशन्स प्लॅटफॉर्म</p>
  <button style="width:auto; padding:14px 32px; font-size:16px; font-weight:700; border-radius:12px;" onclick="showAuthFromLanding()">सुरू करा (Get Started)</button>
</div>

<div id="auth-screen" style="display:none">
  <h1>Welcome to Weavo</h1>
  <p class="tag">One World. One Communication Layer.</p>
  <input id="reg-username" placeholder="Username" />
  <input id="reg-email" placeholder="Email address" />
  <input id="reg-password" type="password" placeholder="Password" />
  <button id="login-btn">Continue to Weavo</button>
  <button id="register-btn" class="secondary">नवीन खातं तयार करा</button>
  <div id="error"></div>
</div>

<div id="app">
  <div id="sidebar">
    <div id="me-bar">
      <div class="left">
        <div id="me-avatar">?</div>
        <span class="name" id="me-name"></span>
      </div>
      <div class="right">
        <button id="logout-btn" style="background:transparent; color:var(--muted);">Logout</button>
      </div>
    </div>
    <div id="new-chat"><input id="new-chat-username" placeholder="username टाका (@ शिवाय)..." /><button id="new-chat-btn">Chat</button></div>
    <div id="conv-list"></div>
  </div>
  <div id="chat-area"><div id="empty-state">डावीकडून चॅट निवडा किंवा नवीन सुरू करा</div></div>
</div>

<script>
window.showAuthFromLanding = function() {
  document.getElementById('landing').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'block';
};

const SUPABASE_URL = "https://xpsxbvmziibbrjnadrlm.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhwc3hidm16aWliYnJqbmFkcmxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTY0NTcsImV4cCI6MjEwNDI3MjQ1N30.d-kDYwqFfxP_xfNHQHEYYYZQHr31-75u-UHxYznRP-A";

let sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let me = null;
let activeConv = null;
let messagesChannel = null;
let currentBridgeTargetConvId = null;

const $ = (id) => document.getElementById(id);

function getBridgeParams() {
  let searchStr = window.location.search;
  if (!searchStr && window.location.hash.includes('?')) {
    searchStr = '?' + window.location.hash.split('?')[1];
  }
  const params = new URLSearchParams(searchStr);
  let store = params.get('store') || params.get('merchant');
  let customerEmail = params.get('customer_email') || params.get('email');
  let prefillMsg = params.get('prefill_msg');

  if (store || prefillMsg || customerEmail) {
    localStorage.setItem('weavo_pending_bridge', JSON.stringify({ store, customerEmail, prefillMsg }));
  } else {
    const saved = localStorage.getItem('weavo_pending_bridge');
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        store = store || parsed.store;
        customerEmail = customerEmail || parsed.customerEmail;
        prefillMsg = prefillMsg || parsed.prefillMsg;
      } catch(e) {}
    }
  }
  return { store, customerEmail, prefillMsg };
}

// 🌟 अत्यंत अचूक आणि मजबूत handleStoreBridge फंक्शन (दुकाननाव/स्लगद्वारे बिझनेस मालक शोधणे)
async function handleStoreBridge() {
  if (!me) return;
  const bridge = getBridgeParams();
  const storeQuery = bridge.store || bridge.customerEmail;
  if (!storeQuery) return;

  const cleanQuery = storeQuery.trim().toLowerCase();
  
  try {
    let storeUserId = null;
    let storeDisplayName = '@' + cleanQuery;

    // १. business_profiles टेबलमधून दुकान किंवा स्लग शोधणे
    const { data: bizList } = await sb.from('business_profiles').select('owner_id, name, slug');
    if (bizList && bizList.length > 0) {
      const foundBiz = bizList.find(b => 
        (b.name && b.name.toLowerCase().includes(cleanQuery)) || 
        (b.slug && b.slug.toLowerCase() === cleanQuery)
      );
      if (foundBiz && foundBiz.owner_id) {
        storeUserId = foundBiz.owner_id;
        if (foundBiz.name) storeDisplayName = '@' + foundBiz.name;
      }
    }

    // २. profiles टेबलमधून युजर शोधणे
    if (!storeUserId) {
      const { data: profList } = await sb.from('profiles').select('id, username, email');
      if (profList && profList.length > 0) {
        const foundProf = profList.find(p => 
          (p.username && p.username.toLowerCase().includes(cleanQuery)) || 
          (p.email && p.email.toLowerCase() === cleanQuery)
        );
        if (foundProf && foundProf.id) {
          storeUserId = foundProf.id;
          if (foundProf.username) storeDisplayName = '@' + foundProf.username;
        }
      }
    }

    // ३. युजर न मिळाल्यास आपोआप नवीन बिझनेस प्रोफाईल तयार करणे
    if (!storeUserId) {
      const fallbackName = cleanQuery.split('@')[0].replace(/[^a-z0-9_]/g, '_');
      const targetEmail = cleanQuery.includes('@') ? cleanQuery : `${fallbackName}@erp.local`;
      
      const { data: newProf } = await sb.from('profiles').insert({
        username: fallbackName,
        email: targetEmail,
        account_type: 'business'
      }).select('id, username').maybeSingle();

      if (newProf) {
        storeUserId = newProf.id;
        storeDisplayName = '@' + newProf.username;
      }
    }

    if (!storeUserId || storeUserId === me.id) return;

    // ४. ग्राहक आणि दुकानदार यांच्यातील चॅट कन्वर्सेशन जोडणे
    const { data: myConvs } = await sb.from('conversation_members').select('conversation_id').eq('user_id', me.id);
    const myIds = (myConvs || []).map(r => r.conversation_id);
    let targetConvId = null;

    if (myIds.length > 0) {
      const { data: theirConvs } = await sb.from('conversation_members').select('conversation_id').eq('user_id', storeUserId).in('conversation_id', myIds);
      if (theirConvs && theirConvs.length > 0) targetConvId = theirConvs[0].conversation_id;
    }

    if (!targetConvId) {
      const { data: newConv } = await sb.from('conversations').insert({ type: 'direct', created_by: me.id }).select().single();
      if (newConv) {
        targetConvId = newConv.id;
        await sb.from('conversation_members').insert([
          { conversation_id: targetConvId, user_id: me.id },
          { conversation_id: targetConvId, user_id: storeUserId },
        ]);
      }
    }

    if (targetConvId) {
      currentBridgeTargetConvId = targetConvId; 
      await loadConversations();
      openConversation(targetConvId, storeDisplayName, 'direct');
    }
  } catch(err) {
    console.error("Bridge chat open error:", err);
  }
}

async function setupUserSession(user) {
  if (!user || me) return;
  me = { id: user.id, username: user.email?.split('@')[0] || 'user', email: user.email };
  
  document.getElementById('landing').style.display = 'none';
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  
  $('me-name').textContent = '@' + me.username;
  loadConversations();
  
  setTimeout(() => handleStoreBridge(), 800);
}

if ($('login-btn')) {$('login-btn').onclick = async () => {
    const email = $('reg-email').value.trim();
    const password = $('reg-password').value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { $('error').textContent = error.message; return; }
    setupUserSession(data.user);
  };
}

if ($('logout-btn')) {$('logout-btn').onclick = async () => {
    await sb.auth.signOut();
    me = null;
    localStorage.removeItem('weavo_pending_bridge');
    location.reload();
  };
}

async function loadConversations() {
  const { data: memberRows } = await sb.from('conversation_members').select('conversation_id').eq('user_id', me.id);
  const ids = (memberRows || []).map(r => r.conversation_id);
  const list = $('conv-list');
  list.innerHTML = '';
  if (!ids.length) return;

  const { data: convs } = await sb.from('conversations').select('id, type, name').in('id', ids);
  for (const c of convs || []) {
    const div = document.createElement('div');
    div.className = 'conv-item' + (c.id === activeConv ? ' active' : '');
    div.innerHTML = `<div class="conv-avatar">💬</div><div class="conv-text"><div class="who">${c.name || 'Chat'}</div></div>`;
    div.onclick = () => openConversation(c.id, c.name || 'Chat', c.type);
    list.appendChild(div);
  }
}

async function openConversation(id, title, type) {
  activeConv = id;
  $('app').classList.add('chat-open');$('chat-area').innerHTML = `
    <div id="chat-header"><b>${title}</b></div>
    <div id="messages"></div>
    <div id="composer">
      <input id="msg-input" placeholder="मेसेज लिहा..." />
      <button id="send-btn">पाठवा</button>
    </div>
  `;

  const { data: history } = await sb.from('messages').select('*').eq('conversation_id', id).order('created_at', { ascending: true });
  const box = $('messages');
  box.innerHTML = '';
  for (const m of history || []) {
    const mine = m.sender_id === me.id;
    box.innerHTML += `<div class="bubble ${mine ? 'me' : 'them'}">${m.content}</div>`;
  }
  box.scrollTop = box.scrollHeight;

  // ऑटो-पेस्ट ऑर्डर मेसेज
  if (currentBridgeTargetConvId && id === currentBridgeTargetConvId) {
    const bridge = getBridgeParams();
    if (bridge.prefillMsg) {
      setTimeout(() => {
        const msgInput = document.getElementById('msg-input');
        if (msgInput) {
          msgInput.value = decodeURIComponent(bridge.prefillMsg);
          msgInput.focus();
          localStorage.removeItem('weavo_pending_bridge');
          currentBridgeTargetConvId = null;
        }
      }, 500);
    }
  }

  $('send-btn').onclick = async () => {
    const input = $('msg-input');
    const content = input.value.trim();
    if (!content) return;
    input.value = '';
    await sb.from('messages').insert({ conversation_id: activeConv, sender_id: me.id, content });
  };
}

// ॲप सुरु करताना सेशन तपासा
sb.auth.getSession().then(({ data: { session } }) => {
  if (session?.user) setupUserSession(session.user);
});
</script>
</body>
</html>
