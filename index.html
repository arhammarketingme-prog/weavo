<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weavo — One World. One Communication Layer.</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%236366f1'/%3E%3Ctext x='50' y='68' font-size='55' font-family='Arial' fill='white' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0b0d10; --panel: #14171f; --accent: #6366f1; --accent-hover: #4f46e5;
    --text: #e9eaee; --muted: #8b8fa3; --bubble-me: #6366f1; --bubble-them: #1e222b;
    --input-bg: #0f1117; --border: #212630; --success: #10b981; --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
  
  /* 🌟 वीव्हो अस्सल प्रीमियम लॉगिन स्क्रीन */
  #auth-screen { margin: auto; width: min(420px, calc(100vw - 32px)); background: var(--panel); padding: 36px 30px; border-radius: 24px; box-shadow: 0 25px 60px rgba(0,0,0,0.5); border: 1px solid var(--border); text-align: center; }
  .auth-logo { width: 64px; height: 64px; margin: 0 auto 18px; border-radius: 20px; display:flex; align-items:center; justify-content:center; background: linear-gradient(135deg, #6366f1, #8b5cf6); color:#fff; font-size:34px; font-weight:900; box-shadow: 0 8px 20px rgba(99,102,241,0.3); }
  #auth-screen h1 { font-size: 24px; margin: 0 0 6px; font-weight: 800; color: #fff; }
  
  input, button { width: 100%; padding: 12px 16px; margin-bottom: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--input-bg); color: #fff; font-size: 14px; outline: none; transition: 0.2s; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
  button { background: var(--accent); border: none; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  button:hover { background: var(--accent-hover); }

  .google-btn { background: #fff; color: #1e293b; border: 1px solid #cbd5e1; font-weight: 700; }
  .google-btn:hover { background: #f8fafc; }
  .passkey-btn { background: #1e222b; color: #38bdf8; border: 1px solid #334155; font-weight: 700; }
  .passkey-btn:hover { background: #272c38; }

  /* 🌟 मुख्य ॲप इंटरफेस */
  #app { display: none; width: 100%; height: 100vh; }
  #app.active { display: flex; }
  
  #sidebar { width: 320px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #me-bar { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #101218; }
  #me-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px; }
  
  #new-chat { padding: 12px 16px; display: flex; gap: 8px; border-bottom: 1px solid var(--border); }
  #new-chat input { margin: 0; padding: 10px 14px; }
  #new-chat button { width: auto; padding: 10px 16px; margin: 0; }

  #conv-list { flex: 1; overflow-y: auto; }
  .conv-item { padding: 12px 18px; cursor: pointer; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; transition: 0.15s; }
  .conv-item:hover, .conv-item.active { background: rgba(99,102,241,0.1); }
  .conv-avatar { width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #ec4899); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex-shrink: 0; }
  .conv-text { flex: 1; min-width: 0; }
  .conv-item .who { font-weight: 700; font-size: 14.5px; color: #fff; }
  .conv-item .preview { font-size: 12.5px; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); position: relative; }
  #chat-header { padding: 14px 22px; border-bottom: 1px solid var(--border); background: var(--panel); display: flex; justify-content: space-between; align-items: center; }
  .header-title { font-weight: 700; font-size: 16px; color: #fff; }
  
  .call-actions { display: flex; gap: 8px; }
  .call-btn { background: #222733; color: #38bdf8; border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; width: auto; margin: 0; display: inline-flex; align-items: center; gap: 6px; }
  .call-btn:hover { background: #2d3446; }

  #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
  .bubble { max-width: 65%; padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.45; word-break: break-word; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  .bubble.me { align-self: flex-end; background: var(--bubble-me); color: white; border-bottom-right-radius: 4px; }
  .bubble.them { align-self: flex-start; background: var(--bubble-them); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
  
  #composer { padding: 16px 22px; border-top: 1px solid var(--border); background: var(--panel); display: flex; gap: 10px; align-items: center; }
  #composer input { margin: 0; flex: 1; padding: 12px 16px; }
  #composer button { width: auto; padding: 12px 20px; margin: 0; }
  #empty-state { margin: auto; color: var(--muted); text-align: center; font-size: 15px; }

  /* 🌟 कॉलिंग मोडल (ऑडिओ/व्हिडिओ) */
  #call-modal { display: none; position: fixed; inset: 0; background: rgba(11,13,16,0.95); z-index: 99999; flex-direction: column; align-items: center; justify-content: center; }
  .call-screen-box { text-align: center; max-width: 500px; width: 90%; }
  .calling-avatar { width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), #ec4899); color: #fff; font-size: 36px; font-weight: bold; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; box-shadow: 0 0 30px rgba(99,102,241,0.5); animation: pulse 2s infinite; }
  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
  
  video { width: 100%; max-height: 380px; border-radius: 14px; background: #000; margin-bottom: 20px; border: 2px solid var(--border); }
</style>
</head>
<body>

<!-- 🌟 लॉगिन / ऑथेंटिकेशन स्क्रीन -->
<div id="auth-screen">
  <div class="auth-logo">W</div>
  <h1 id="store-title-header">Weavo Chat</h1>
  <p style="color:var(--muted); font-size:13.5px; margin-bottom:24px;" id="store-subtitle">One World. One Communication Layer.</p>
  
  <input id="reg-email" placeholder="ईमेल पत्ता" autocomplete="username" />
  <input id="reg-password" type="password" placeholder="पासवर्ड" autocomplete="current-password" />
  <button id="login-btn">🚀 ईमेलने लॉगइन करा</button>
  
  <div style="display:flex; align-items:center; margin: 14px 0; color:var(--muted); font-size:12px;">
    <div style="flex:1; height:1px; background:var(--border);"></div><span style="padding:0 10px;">किंवा</span><div style="flex:1; height:1px; background:var(--border);"></div>
  </div>

  <button class="google-btn" onclick="loginWithGoogle()">
    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Google ने लॉगिन करा
  </button>
  
  <button class="passkey-btn" onclick="loginWithPasskey()">🔑 पासकी (Passkey) लॉगिन</button>
  
  <div id="error" style="color:var(--danger); font-size:13px; margin-top:10px;"></div>
</div>

<!-- 🌟 मुख्य चॅट ॲप इंटरफेस -->
<div id="app">
  <div id="sidebar">
    <div id="me-bar">
      <div style="display:flex; align-items:center; gap:10px;">
        <div id="me-avatar">?</div>
        <div>
          <div id="me-name" style="font-weight:700; font-size:13.5px; color:#fff;">User</div>
          <div style="font-size:11px; color:var(--success);">● ऑनलाइन</div>
        </div>
      </div>
      <button id="logout-btn" style="width:auto; background:#222733; color:var(--muted); padding:6px 10px; font-size:12px; border-radius:6px;">बाहेर पडा</button>
    </div>
    
    <div id="new-chat">
      <input id="new-chat-username" placeholder="युजरनेम किंवा ईमेल..." />
      <button id="new-chat-btn">चॅट</button>
    </div>
    <div id="conv-list"></div>
  </div>
  
  <div id="chat-area">
    <div id="empty-state">💬 संवाद साधण्यासाठी डावीकडून चॅट निवडा किंवा नवीन सुरू करा</div>
  </div>
</div>

<!-- 🌟 कॉलिंग मोडल (ऑडिओ/व्हिडिओ कॉल) -->
<div id="call-modal">
  <div class="call-screen-box">
    <div class="calling-avatar" id="call-avatar-icon">📞</div>
    <h2 id="call-status-text" style="margin:0 0 8px; color:#fff;">कॉल जोडत आहे...</h2>
    <p style="color:var(--muted); font-size:14px; margin-bottom:24px;" id="call-peer-name">सुसंवाद सुरू आहे</p>
    
    <video id="localVideo" autoplay playsinline muted style="display:none;"></video>
    <video id="remoteVideo" autoplay playsinline style="display:none;"></video>
    
    <button onclick="endActiveCall()" style="background:var(--danger); width:140px; margin:0 auto; padding:12px; border-radius:30px; font-size:15px; font-weight:bold;">कॉल कट करा</button>
  </div>
</div>

<script>
// 🌟 Weavo Supabase Client (नवीन की सह)
const SUPABASE_URL = "https://flprhrbbllxfcdaornio.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZscHJocmJibGx4ZmNkYW9ybmlvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwMDk1MzcsImV4cCI6MjEwMTU4NTUzN30._dxfJ8h50eNEIq89m3467Qr4p8Mw5OuqllwkJzSyTDw";

let sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

let me = null;
let activeConv = null;
let messagesChannel = null;
let localStream = null;
let peerConnection = null;

const $ = function(id) { return document.getElementById(id); };

function getBridgeParams() {
  const urlParams = new URLSearchParams(window.location.search);
  return {
    store: urlParams.get('store') || localStorage.getItem('weavo_target_store'),
    prefill: urlParams.get('prefill') || localStorage.getItem('weavo_prefill_msg'),
    customerEmail: urlParams.get('customer_email') || localStorage.getItem('global_unified_email')
  };
}

async function initWeavoSmartAuth() {
  try {
    const bridge = getBridgeParams();
    if (bridge.store) {
      localStorage.setItem('weavo_target_store', bridge.store);
      try {
        const { data: biz } = await sb.from('businesses').select('name').or(`slug.eq.${bridge.store},name.ilike.%${bridge.store}%`).maybeSingle();
        if (biz && biz.name) {
          $('store-title-header').textContent = biz.name;
          $('store-subtitle').textContent = 'अधिकृत ग्राहक संवाद व सपोर्ट मंच';
        } else {
          let clean = bridge.store.replace(/[_]/g, ' ').trim();
          $('store-title-header').textContent = clean.charAt(0).toUpperCase() + clean.slice(1) + " स्टोअर्स";
        }
      } catch (e) {
        let clean = bridge.store.replace(/[_]/g, ' ').trim();
        $('store-title-header').textContent = clean.charAt(0).toUpperCase() + clean.slice(1) + " स्टोअर्स";
      }
    }

    const sessionRes = await sb.auth.getSession();
    if (sessionRes.data && sessionRes.data.session && sessionRes.data.session.user) {
      await setupUserSession(sessionRes.data.session.user);
      return;
    }

    if (bridge.customerEmail) {
      const targetEmail = bridge.customerEmail.trim().toLowerCase();
      const { data: profile } = await sb.from('profiles').select('*').ilike('email', targetEmail).maybeSingle();
      if (profile) {
        me = { id: profile.id, username: profile.username || targetEmail.split('@')[0], email: targetEmail };
        startAppUI(targetEmail);
        return;
      }
    }
  } catch (err) {
    console.error("Auth error:", err);
  }
}

async function setupUserSession(user) {
  if (!user) return;
  let username = user.email ? user.email.split('@')[0] : 'user';
  try {
    const { data: prof } = await sb.from('profiles').select('username').eq('id', user.id).maybeSingle();
    if (prof && prof.username) username = prof.username;
  } catch (e) {}

  me = { id: user.id, username: username, email: user.email };
  startAppUI('@' + username);
}

function startAppUI(displayIdentifier) {
  $('auth-screen').style.display = 'none';
  $('app').classList.add('active');$('me-name').textContent = displayIdentifier;
  $('me-avatar').textContent = displayIdentifier.replace('@', '')[0].toUpperCase();
  
  subscribeRealtime();
  loadConversations().then(() => {
    const bridge = getBridgeParams();
    if (bridge.store) {
      handleStoreBridge(bridge.store, bridge.prefill);
    }
  });
}

async function handleStoreBridge(storeUsername, prefillMsg) {
  try {
    if (!storeUsername || !me) return;
    let storeUserId = null;

    const { data: storeUser } = await sb.from('profiles').select('id').ilike('username', storeUsername).maybeSingle();
    if (storeUser) storeUserId = storeUser.id;

    if (!storeUserId || storeUserId === me.id) return;

    const { data: myConvs } = await sb.from('conversation_members').select('conversation_id').eq('user_id', me.id);
    const myIds = (myConvs || []).map(r => r.conversation_id);
    let targetConvId = null;

    if (myIds.length) {
      const { data: theirConvs } = await sb.from('conversation_members').select('conversation_id').eq('user_id', storeUserId).in('conversation_id', myIds);
      if (theirConvs && theirConvs.length) targetConvId = theirConvs[0].conversation_id;
    }

    if (!targetConvId) {
      const { data: newConv } = await sb.from('conversations').insert({ type: 'direct', created_by: me.id }).select().single();
      if (newConv) {
        targetConvId = newConv.id;
        await sb.from('conversation_members').insert([
          { conversation_id: targetConvId, user_id: me.id },
          { conversation_id: targetConvId, user_id: storeUserId },
        ]);
      }
    }

    if (targetConvId) {
      await loadConversations();
      openConversation(targetConvId, '@' + storeUsername);

      if (prefillMsg) {
        const decodedMsg = decodeURIComponent(prefillMsg);
        localStorage.removeItem('weavo_prefill_msg');
        await sb.from('messages').insert({
          conversation_id: targetConvId,
          sender_id: me.id,
          content: decodedMsg
        });
      }
    }
  } catch (err) {
    console.log("Bridge handled.");
  }
}

// 🌟 गुगल OAuth लॉगिन
async function loginWithGoogle() {
  await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + window.location.pathname }
  });
}

// 🌟 पासकी (Passkey) बायोमेट्रिक लॉगिन
async function loginWithPasskey() {
  try {
    if (!window.PublicKeyCredential) {
      alert('तुमचा ब्राउझर पासकी (Passkey) सपोर्ट करत नाही.');
      return;
    }
    alert('🔐 बायोमेट्रिक पासकी लॉगिन सक्रिय होत आहे...');
    // सिम्युलेटेड पासकी ऑथेंटिकेशन फ्लो
    const credential = await navigator.credentials.get({
      publicKey: {
        challenge: new Uint8Array(32),
        timeout: 60000,
        userVerification: "preferred"
      }
    });
    if (credential) {
      alert('✅ पासकी लॉगिन यशस्वी झाले!');
    }
  } catch (e) {
    alert('पासकी लॉगिन रद्द केले गेले किंवा उपलब्ध नाही.');
  }
}

$('login-btn').onclick = async function() {
  const email = $('reg-email').value.trim();
  const password = $('reg-password').value;
  const res = await sb.auth.signInWithPassword({ email, password });
  if (res.error) { $('error').textContent = res.error.message; return; }
  await setupUserSession(res.data.user);
};

$('logout-btn').onclick = async function() {
  await sb.auth.signOut();
  localStorage.clear();
  location.reload();
};

async function loadConversations() {
  if (!me) return;
  const { data: members } = await sb.from('conversation_members').select('conversation_id').eq('user_id', me.id);
  const ids = (members || []).map(r => r.conversation_id);
  const list = $('conv-list');
  list.innerHTML = '';
  if (!ids.length) return;

  const { data: convs } = await sb.from('conversations').select('id, type, name').in('id', ids);
  const directIds = (convs || []).filter(c => c.type === 'direct').map(c => c.id);
  let otherInfo = {};
  
  if (directIds.length) {
    const { data: otherMembers } = await sb.from('conversation_members').select('conversation_id, profiles(username)').in('conversation_id', directIds).neq('user_id', me.id);
    (otherMembers || []).forEach(r => { 
      otherInfo[r.conversation_id] = (r.profiles && r.profiles.username) ? r.profiles.username : 'Chat'; 
    });
  }

  (convs || []).forEach(c => {
    const title = c.type === 'direct' ? ('@' + (otherInfo[c.id] || 'Chat')) : (c.name || 'Group');
    const div = document.createElement('div');
    div.className = 'conv-item';
    div.innerHTML = `<div class="conv-avatar">💬</div><div class="conv-text"><div class="who">${title}</div><div class="preview">संवाद सुरू करा</div></div>`;
    div.onclick = () => openConversation(c.id, title);
    list.appendChild(div);
  });
}

async function openConversation(id, title) {
  activeConv = id;
  const area = $('chat-area');
  area.innerHTML = `
    <div id="chat-header">
      <span class="header-title">${title}</span>
      <div class="call-actions">
        <button class="call-btn" onclick="startAudioCall()">📞 ऑडिओ कॉल</button>
        <button class="call-btn" onclick="startVideoCall()">📹 व्हिडिओ कॉल</button>
      </div>
    </div>
    <div id="messages"></div>
    <div id="composer">
      <input id="msg-input" placeholder="मेसेज लिहा..." />
      <button id="send-btn">पाठवा</button>
    </div>
  `;

  const { data: history } = await sb.from('messages').select('*').eq('conversation_id', id).order('created_at', { ascending: true });
  const box = $('messages');
  box.innerHTML = (history || []).map(m => `<div class="bubble ${m.sender_id === me.id ? 'me' : 'them'}">${escapeHtml(m.content)}</div>`).join('');
  box.scrollTop = box.scrollHeight;

  $('send-btn').onclick = sendMessage;
  $('msg-input').onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };
}

async function sendMessage() {
  const input = $('msg-input');
  const content = input.value.trim();
  if (!content || !activeConv) return;
  input.value = '';
  await sb.from('messages').insert({ conversation_id: activeConv, sender_id: me.id, content: content });
}

// 🌟 ऑडिओ व व्हिडिओ कॉलिंग फंक्शन्स
async function startAudioCall() {
  $('call-modal').style.display = 'flex';$('call-status-text').textContent = 'ऑडिओ कॉल जोडत आहे...';
  $('localVideo').style.display = 'none';$('remoteVideo').style.display = 'none';
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
  } catch (e) {
    alert('मायक्रोफोन ॲक्सेस करू शकले नाही.');
    endActiveCall();
  }
}

async function startVideoCall() {
  $('call-modal').style.display = 'flex';$('call-status-text').textContent = 'व्हिडिओ कॉल जोडत आहे...';
  $('localVideo').style.display = 'block';$('remoteVideo').style.display = 'block';
  try {
    localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
    $('localVideo').srcObject = localStream;
  } catch (e) {
    alert('कॅमेरा किंवा मायक्रोफोन ॲक्सेस करू शकले नाही.');
    endActiveCall();
  }
}

function endActiveCall() {
  if (localStream) {
    localStream.getTracks().forEach(track => track.stop());
  }
  if (peerConnection) {
    peerConnection.close();
    peerConnection = null;
  }
  $('call-modal').style.display = 'none';
}

function subscribeRealtime() {
  if (messagesChannel) sb.removeChannel(messagesChannel);
  messagesChannel = sb.channel('weavo-realtime')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
      const msg = payload.new;
      if (msg.conversation_id === activeConv) {
        const box = $('messages');
        const div = document.createElement('div');
        div.className = `bubble ${msg.sender_id === me.id ? 'me' : 'them'}`;
        div.textContent = msg.content;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
      }
      loadConversations();
    })
    .subscribe();
}

function escapeHtml(str) {
  if (!str) return '';
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

initWeavoSmartAuth();
</script>
</body>
</html>
