<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weavo Messaging</title>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; text-align: center; }
        .card { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .btn { padding: 10px 20px; font-size: 16px; background-color: #059669; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Weavo App</h2>
        <div id="loading" style="display: none;">ऑटो-लॉगिन होत आहे, कृपया थांबा...</div>
        
        <div id="loginArea">
            <p>थेट प्रवेशासाठी गुगल लॉगिन करा:</p>
            <button class="btn" onclick="signInGoogle()">Continue with Google</button>
        </div>

        <div id="appArea" style="display: none;">
            <h3>स्वागत आहे!</h3>
            <p>तुमचे खाते: <span id="weavoUser"></span></p>
            <button class="btn" style="background-color: #dc2626;" onclick="logout()">लॉगआउट</button>
        </div>
    </div>

    <script>
        const WEAVO_SUPABASE_URL = 'https://xpsxbvmziibbrjnadrlm.supabase.co';
        const WEAVO_SUPABASE_KEY = 'YOUR_WEAVO_ANON_KEY'; // हांगा तुमची Weavo anon key घाला
        const supabaseClient = supabase.createClient(WEAVO_SUPABASE_URL, WEAVO_SUPABASE_KEY);

        async function handleSSOAndAuth() {
            // १. जर URL मदीं AllERP चे टोकन आयिल्लें आसा जाल्यार
            if (window.location.hash.includes('access_token')) {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('loginArea').style.display = 'none';

                const hashParams = new URLSearchParams(window.location.hash.substring(1));
                const access_token = hashParams.get('access_token');
                const refresh_token = hashParams.get('refresh_token');

                if (access_token && refresh_token) {
                    const { data, error } = await supabaseClient.auth.setSession({
                        access_token: access_token,
                        refresh_token: refresh_token
                    });

                    // URL मदल्यान टोकन काडून उडोवप जेन्ना कन्सोल नितळ उरतले
                    window.history.replaceState(null, null, window.location.pathname);

                    if (!error && data.session) {
                        showApp(data.session.user.email);
                        return;
                    }
                }
            }

            // २. सामान्य चालू आशिल्लें सेशन तपासप
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                showApp(session.user.email);
            } else {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('loginArea').style.display = 'block';
            }
        }

        function showApp(email) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('loginArea').style.display = 'none';
            document.getElementById('appArea').style.display = 'block';
            document.getElementById('weavoUser').innerText = email;
        }

        async function signInGoogle() {
            await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
                options: {
                    redirectTo: window.location.origin + window.location.pathname
                }
            });
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.reload();
        }

        window.addEventListener('DOMContentLoaded', handleSSOAndAuth);
    </script>
</body>
</html>
