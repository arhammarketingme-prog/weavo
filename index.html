<!DOCTYPE html>
<html lang="mr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weavo — Communication Layer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { margin: 0; font-family: Roboto, sans-serif; background: #0f1115; color: #e9eaee; height: 100vh; display: flex; align-items: center; justify-content: center; }
  .box { background: #171a21; padding: 30px; border-radius: 12px; border: 1px solid #22252e; text-align: center; width: 350px; }
  input, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #22252e; background: #10121a; color: #fff; font-size: 14px; }
  button { background: #6366f1; border: none; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>
<div class="box">
  <h2>Weavo Chat</h2>
  <input id="email" placeholder="Email address" />
  <input id="password" type="password" placeholder="Password" />
  <button id="login">Login</button>
</div>

<script>
const SUPABASE_URL = "https://xpsxbvmziibbrjnadrlm.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhwc3hidm16aWliYnJqbmFkcmxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTY0NTcsImV4cCI6MjEwNDI3MjQ1N30.d-kDYwqFfxP_xfNHQHEYYYZQHr31-75u-UHxYznRP-A";[cite: 5]

let sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true }

  alert('यशस्वीरीत्या लॉगिन झाले!');
};
</script>
